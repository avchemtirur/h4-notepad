                <div style="font-size:11px;font-weight:800;color:var(--notes);text-transform:uppercase;margin-bottom:6px;">Note</div>
                <div class="small-muted">${escapeHtml(d.note.title || d.note.body).slice(0,140)}${(d.note.body||'').length > 140 ? '…' : ''}</div>
              </div>` : ''}
              ${d.followup.required ? `
              <div class="card" style="margin-bottom:12px;">
                <div style="font-size:11px;font-weight:800;color:var(--followup);text-transform:uppercase;margin-bottom:6px;">Follow-up</div>
                <div class="small-muted">${fmtDate(d.followup.date)} ${fmtTime(d.followup.time)} · ${escapeHtml(d.followup.reason)}</div>
              </div>` : ''}
              ${d.reminder.create ? `
              <div class="card" style="margin-bottom:12px;">
                <div style="font-size:11px;font-weight:800;color:var(--reminder);text-transform:uppercase;margin-bottom:6px;">Reminder</div>
                <div class="small-muted">${fmtDate(d.reminder.date)} ${fmtTime(d.reminder.time)} · ${escapeHtml(d.reminder.reason)}</div>
              </div>` : ''}
              <p class="small-muted">Saving will link all of the above to one customer record.</p>
              `;
            }

            function switchField(bindPath, label, checked) {
                return `<label class="switch-row" style="cursor:pointer;">
              <div class="sr-label">${label}</div>
              <label class="switch"><input type="checkbox" data-bind-toggle="${bindPath}" ${checked ? 'checked' : ''}><span class="track"></span><span class="knob"></span></label>
            </label>`;
            }

            // ---- Event delegation ----
            document.addEventListener('click', async function(e) {
                const el = e.target.closest('[data-act]');
                if (!el) return;
                const act = el.dataset.act;
                const id = el.dataset.id,
                    val = el.dataset.val,
                    idx = el.dataset.idx,
                    route_ = el.dataset.route;

                switch (act) {
                    case 'nav':
                        nav(route_, id ? { id } : null);
                        break;
                    case 'startWizard':
                        startWizard(false);
                        break;
                    case 'resumeDraft':
                        startWizard(true);
                        break;
                    case 'closeWizard':
                        if (confirm('Close without saving? Your progress is kept as a draft you can resume.')) { nav(
                                'dashboard'); }
                        break;
                    case 'wizNext':
                        wizardNext();
                        break;
                    case 'wizPrev':
                        wStep = Math.max(1, wStep - 1);
                        render();
                        break;
                    case 'wizSave':
                        await saveCustomerRecord();
                        break;

                    case 'selectCustomerCategory':
                        draft.customer.category = val;
                        saveDraft();
                        render();
                        break;
                    case 'toggleItem': {
                        const s = draft.items.selected;
                        const i = s.indexOf(val);
                        if (i > -1) s.splice(i, 1);
                        else s.push(val);
                        saveDraft();
                        render();
                        break;
                    }
                    case 'toggleAddItem':
                        addingNewItem = !addingNewItem;
                        render();
                        break;
                    case 'saveNewItem':
                        saveNewItemFromForm();
                        break;
                    case 'selectContactCategory':
                        draft.contact.category = val;
                        saveDraft();
                        render();
                        break;
                    case 'selectContactMethod':
                        draft.contact.method = val;
                        saveDraft();
                        render();
                        break;
                    case 'selectNoteCategory':
                        draft.note.category = val;
                        saveDraft();
                        render();
                        break;
                    case 'removeNoteImage':
                        draft.note.images.splice(+idx, 1);
                        saveDraft();
                        render();
                        break;
                    case 'removeCustomerPhoto':
                        draft.customer.photo = null;
                        saveDraft();
                        render();
                        break;
                    case 'selectFollowupMethod':
                        draft.followup.method = val;
                        saveDraft();
                        render();
                        break;
                    case 'selectFollowupPriority':
                        draft.followup.priority = val;
                        saveDraft();
                        render();
                        break;
                    case 'selectReminderMethod':
                        draft.reminder.method = val;
                        saveDraft();
                        render();
                        break;
                    case 'selectReminderPriority':
                        draft.reminder.priority = val;
                        saveDraft();
                        render();
                        break;
                    case 'selectReminderSound':
                        draft.reminder.sound = val;
                        saveDraft();
                        render();
                        break;
                    case 'requestNotifPermission':
                        requestNotifPermission();
                        break;

                    case 'filterCustomers':
                        filterStatus = val;
                        render();
                        break;
                    case 'filterCategory':
                        filterCategory = val === 'more' ? filterCategory : val;
                        render();
                        break;
                    case 'clearFilters':
                        filterStatus = 'all';
                        filterCategory = 'all';
                        filterPriority = 'all';
                        customerSearch = '';
                        render();
                        break;
                    case 'histFilter':
                        historyFilter = val;
                        render();
                        break;

                    case 'dismissBanner':
                        bannerDismissed = true;
                        render();
                        break;
                    case 'dismissMissed':
                        await dismissMissed(id);
                        break;

                    case 'callCustomer':
                        doCall(id);
                        break;
                    case 'waCustomer':
                        doWhatsapp(id);
                        break;
                    case 'completeReminder':
                        await completeReminderNative(id);
                        break;
                    case 'openSnooze':
                        modal = { type: 'snooze', data: { id } };
                        renderModal();
                        break;
                    case 'openReschedule':
                        modal = { type: 'reschedule', data: { id } };
                        renderModal();
                        break;
                    case 'doSnooze':
                        await doSnooze(val);
                        break;
                    case 'doReschedule':
                        await doReschedule();
                        break;
                    case 'doCompleteWithNote':
                        await doCompleteWithNote();
                        break;
                    case 'doFollowupNext':
                        await doFollowupNext();
                        break;
                    case 'toggleArchive':
                        await toggleArchive(id);
                        break;

                    case 'openAddNote':
                        modal = { type: 'addNote', data: { customerId: id, title: '', body: '', category: '',
                                images: [] } };
                        renderModal();
                        break;
                    case 'openAddContact':
                        modal = { type: 'addContact', data: { customerId: id, category: '', method: '',
                                date: todayISO(), time: nowHHMM(), details: '' } };
                        renderModal();
                        break;
                    case 'openAddReminder':
                        modal = { type: 'addReminder', data: { customerId: id, date: todayISO(), time: nowHHMM(),
                                reason: '', priority: 'Normal' } };
                        renderModal();
                        break;
                    case 'closeModal':
                        modal = null;
                        renderModal();
                        break;
                    case 'closeModalBg':
                        modal = null;
                        renderModal();
                        break;
                    case 'mSelectNoteCat':
                        modal.data.category = val;
                        renderModal();
                        break;
                    case 'mRemoveNoteImage':
                        modal.data.images.splice(+idx, 1);
                        renderModal();
                        break;
                    case 'mSelectContactCat':
                        modal.data.category = val;
                        renderModal();
                        break;
                    case 'mSelectContactMethod':
                        modal.data.method = val;
                        renderModal();
                        break;
                    case 'mSelectRemPriority':
                        modal.data.priority = val;
                        renderModal();
                        break;
                    case 'saveModalNote':
                        await saveModalNote();
                        break;
                    case 'saveModalContact':
                        await saveModalContact();
                        break;
                    case 'saveModalReminder':
                        await saveModalReminder();
                        break;

                    case 'testReminder':
                        testReminderNative();
                        break;
                    case 'selectSound':
                        DB.settings.sound = val;
                        await saveDB();
                        render();
                        break;
                    case 'previewSound':
                        previewSound(val);
                        break;
                    case 'clearCustomSound':
                        DB._customSoundName = null;
                        await saveDB();
                        render();
                        break;

                    case 'addCategory':
                        addCategory();
                        break;
                    case 'editCategory':
                        editCategory(id);
                        break;
                    case 'toggleCategory':
                        toggleCategory(id);
                        break;
                    case 'deleteCategory':
                        deleteCategory(id);
                        break;

                    case 'addItem':
                        addItem();
                        break;
                    case 'editItem':
                        editItem(id);
                        break;
                    case 'toggleItemActive':
                        toggleItemActive(id);
                        break;
                    case 'deleteItem':
                        deleteItem(id);
                        break;

                    case 'exportBackup':
                        exportBackup();
                        break;
                    case 'importBackup':
                        importBackup();
                        break;
                    case 'deleteAllData':
                        deleteAllData();
                        break;

                    case 'searchCustomers':
                        customerSearch = el.value;
                        render();
                        break;
                }
            });

            // ---- Input handlers ----
            document.addEventListener('input', function(e) {
                const bindPath = e.target.dataset.bind;
                if (bindPath && draft) { setPath(draft, bindPath, e.target.value);
                    saveDraft(); return; }
                const toggle = e.target.dataset.bindToggle;
                if (toggle && draft) { setPath(draft, toggle, e.target.checked);
                    saveDraft();
                    render(); return; }
                const setKey = e.target.dataset.bindSettings;
                if (setKey) { DB.settings[setKey] = e.target.value;
                    saveDB(); return; }
                const setToggle = e.target.dataset.bindSettingsToggle;
                if (setToggle) { DB.settings[setToggle] = e.target.checked;
                    saveDB(); return; }
                if (e.target.id === 'customerSearchInput') { customerSearch = e.target.value; }
            });

            document.addEventListener('change', function(e) {
                if (e.target.matches('[data-act="searchCustomers"]')) { customerSearch = e.target.value;
                    render(); }
                if (e.target.id === 'noteImageInput') { handleNoteImages(e.target.files, draft.note.images); }
                if (e.target.id === 'mNoteImageInput') { handleNoteImages(e.target.files, modal.data.images); }
                if (e.target.id === 'customerPhotoInput') { handleCustomerPhoto(e.target.files); }
                if (e.target.id === 'customSoundUpload') { handleCustomSound(e.target.files); }
                if (e.target.id === 'newItemImage') { /* read on save */ }
            });

            function handleNoteImages(fileList, targetArr) {
                const isModalTarget = modal && modal.data && modal.data.images === targetArr;
                Array.from(fileList).forEach(f => {
                    compressImage(f, 900, 0.75).then(dataUrl => {
                        targetArr.push(dataUrl);
                        if (isModalTarget) { renderModal(); } else { if (draft && targetArr === draft
                                .note.images) saveDraft();
                            render(); }
                    });
                });
            }

            function handleCustomerPhoto(fileList) {
                if (fileList && fileList[0]) {
                    compressImage(fileList[0], 400, 0.8).then(dataUrl => {
                        draft.customer.photo = dataUrl;
                        saveDraft();
                        render();
                    });
                }
            }

            function handleCustomSound(fileList) {
                if (fileList && fileList[0]) {
                    const f = fileList[0];
                    DB._customSoundName = f.name;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        DB._customSoundData = ev.target.result;
                        saveDB();
                        render();
                        toast('Custom sound uploaded: ' + f.name);
                    };
                    reader.readAsDataURL(f);
                }
            }

            function previewSound(sound) {
                if (sound === 'Custom') {
                    if (DB._customSoundData) {
                        try { const audio = new Audio(DB._customSoundData);
                            audio.play().catch(() => {}); } catch (e) { toast('Cannot play custom sound'); }
                    } else { toast('No custom sound uploaded'); }
                    return;
                }
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = sound === 'Bell' ? 800 : sound === 'Alert' ? 1200 : 600;
                    gain.gain.value = 0.3;
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) { toast('🔊 ' + sound); }
            }

            function requestNotifPermission() {
                if (!window.Notification) { toast('Notifications are not supported in this browser'); return; }
                Notification.requestPermission().then(p => {
                    toast(p === 'granted' ? 'Reminder notifications enabled' : 'Permission not granted');
                    render();
                });
            }

            function wizardNext() {
                if (wStep === 1) {
                    const c = draft.customer;
                    if (!c.name.trim()) { toast('Customer name is required'); return; }
                    if (!c.category) { toast('Please select a customer category'); return; }
                    if (!validMobile(c.mobile)) { toast('Enter a valid 10-digit Indian mobile number'); return; }
                }
                if (wStep === 5 && draft.followup.required) {
                    const f = draft.followup;
                    if (!f.date || !f.time || !f.reason.trim()) { toast('Fill in follow-up date, time, and reason');
                        return; }
                }
                if (wStep === 6 && draft.reminder.create) {
                    const r = draft.reminder;
                    if (!r.date || !r.time || !r.reason.trim()) { toast('Fill in reminder date, time, and reason');
                        return; }
                }
                wStep = Math.min(STEPS.length, wStep + 1);
                render();
            }

            function saveNewItemFromForm() {
                const name = $('#newItemName').value.trim();
                if (!name) { toast('Enter an item name'); return; }
                const icon = $('#newItemIcon').value.trim() || '🧪';
                const desc = $('#newItemDesc').value.trim();
                const fileInput = $('#newItemImage');
                const finish = (imageDataUrl) => {
                    const newId = uid('item');
                    DB.items.push({ id: newId, name, icon, image: imageDataUrl || null, description: desc,
                        active: true });
                    saveDB();
                    draft.items.selected.push(newId);
                    saveDraft();
                    addingNewItem = false;
                    toast('Item added');
                    render();
                };
                if (fileInput.files && fileInput.files[0]) {
                    compressImage(fileInput.files[0], 500, 0.8).then(finish);
                } else finish(null);
            }

            async function saveModalNote() {
                const d = modal.data;
                d.title = $('#mNoteTitle').value.trim();
                d.body = $('#mNoteBody').value.trim();
                if (!d.body && !d.title) { toast('Write something first'); return; }
                DB.notes.push({
                    id: uid('note'),
                    customerId: d.customerId,
                    title: d.title,
                    body: d.body,
                    category: d.category,
                    images: d.images.slice(),
                    createdAt: new Date().toISOString()
                });
                await saveDB();
                modal = null;
                renderModal();
                toast('Note added');
                render();
            }

            async function saveModalContact() {
                const d = modal.data;
                d.date = $('#mContactDate').value;
                d.time = $('#mContactTime').value;
                d.details = $('#mContactDetails').value.trim();
                DB.contacts.push({
                    id: uid('cont'),
                    customerId: d.customerId,
                    category: d.category,
                    method: d.method,
                    date: d.date,
                    time: d.time,
                    eventDate: d.date,
                    eventTime: d.time,
                    details: d.details,
                    createdAt: new Date().toISOString()
                });
                await saveDB();
                modal = null;
                renderModal();
                toast('Contact added');
                render();
            }

            async function saveModalReminder() {
                const d = modal.data;
                d.date = $('#mRemDate').value;
                d.time = $('#mRemTime').value;
                d.reason = $('#mRemReason').value.trim();
                if (!d.date || !d.time) { toast('Pick a date and time'); return; }
                const rem = {
                    id: uid('rem'),
                    customerId: d.customerId,
                    date: d.date,
                    time: d.time,
                    reason: d.reason,
                    method: '',
                    priority: d.priority,
                    repeat: 'none',
                    remindBefore: '0',
                    sound: 'Default',
                    status: 'pending',
                    _notified: false,
                    completionNote: null,
                    history: [{ ts: new Date().toISOString(), event: 'Created' }],
                    createdAt: new Date().toISOString()
                };
                DB.reminders.push(rem);
                await saveDB();
                if (IS_NATIVE) {
                    await scheduleNativeReminder(rem);
                }
                modal = null;
                renderModal();
                toast('Reminder added');
                render();
            }

            async function doFollowupNext() {
                const d = modal.data;
                const date = $('#fuNextDate').value;
                const time = $('#fuNextTime').value;
                const reason = $('#fuNextReason').value.trim();
                if (!date || !time) { toast('Pick a date and time'); return; }
                DB.followups.push({
                    id: uid('fu'),
                    customerId: d.customerId,
                    required: true,
                    date,
                    time,
                    reason: reason || 'Follow-up',
                    method: 'call',
                    priority: 'Normal',
                    createNext: false,
                    completed: false,
                    createdAt: new Date().toISOString()
                });
                await saveDB();
                modal = null;
                renderModal();
                toast('Follow-up created');
                render();
            }

            // ---- Category / Item management ----
            function addCategory() {
                const name = prompt('Enter new category name:');
                if (!name) return;
                const icon = prompt('Enter an emoji icon (e.g. 🏗️):') || '📌';
                const id = uid('cat');
                DB.customerCategories.push({ id, label: name.trim(), icon: icon.trim() || '📌', disabled: false });
                saveDB();
                toast('Category added');
                render();
            }

            function editCategory(id) {
                const c = DB.customerCategories.find(x => x.id === id);
                if (!c) return;
                const newName = prompt('Edit category name:', c.label);
                if (newName === null) return;
                const newIcon = prompt('Edit icon (emoji):', c.icon) || c.icon;
                c.label = newName.trim() || c.label;
                c.icon = newIcon.trim() || c.icon;
                saveDB();
                toast('Category updated');
                render();
            }

            function toggleCategory(id) {
                const c = DB.customerCategories.find(x => x.id === id);
                if (!c) return;
                c.disabled = !c.disabled;
                saveDB();
                toast(c.disabled ? 'Category disabled' : 'Category enabled');
                render();
            }

            function deleteCategory(id) {
                if (!confirm('Delete this category? Customers using it will keep the category name.')) return;
                DB.customerCategories = DB.customerCategories.filter(x => x.id !== id);
                saveDB();
                toast('Category deleted');
                render();
            }

            function addItem() {
                const name = prompt('Enter item name:');
                if (!name) return;
                const icon = prompt('Enter an emoji icon (e.g. 🧪):') || '📦';
                const newId = uid('item');
                DB.items.push({ id: newId, name: name.trim(), icon: icon.trim() || '📦', image: null,
                    description: '', active: true });
                saveDB();
                toast('Item added');
                render();
            }

            function editItem(id) {
                const i = DB.items.find(x => x.id === id);
                if (!i) return;
                const newName = prompt('Edit item name:', i.name);
                if (newName === null) return;
                const newIcon = prompt('Edit icon (emoji):', i.icon) || i.icon;
                i.name = newName.trim() || i.name;
                i.icon = newIcon.trim() || i.icon;
                saveDB();
                toast('Item updated');
                render();
            }

            function toggleItemActive(id) {
                const i = DB.items.find(x => x.id === id);
                if (!i) return;
                i.active = i.active !== false ? false : true;
                saveDB();
                toast(i.active ? 'Item activated' : 'Item deactivated');
                render();
            }

            function deleteItem(id) {
                if (!confirm('Delete this item?')) return;
                DB.items = DB.items.filter(x => x.id !== id);
                DB.customers.forEach(c => {
                    c.items = (c.items || []).filter(iid => iid !== id);
                });
                saveDB();
                toast('Item deleted');
                render();
            }

            // ---- Backup / Restore ----
            function exportBackup() {
                const data = JSON.stringify(DB, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `h4np_backup_${todayISO()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                toast('Backup exported');
            }

            function importBackup() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'application/json';
                input.onchange = e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async ev => {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (!data.customers || !data.reminders) { toast('Invalid backup file');
                                return; }
                            if (!confirm('This will REPLACE all current data. Continue?')) return;
                            DB = Object.assign(defaultDB(), data);
                            await saveDB();
                            toast('Backup restored successfully');
                            render();
                        } catch (err) { toast('Error reading backup file'); }
                    };
                    reader.readAsText(file);
                };
                input.click();
            }

            async function deleteAllData() {
                if (!confirm('⚠️ Delete ALL data? This cannot be undone.')) return;
                if (!confirm('Are you sure? All customers, notes, reminders will be lost.')) return;
                DB = defaultDB();
                await saveDB();
                clearDraft();
                toast('All data deleted');
                render();
            }

            // ---- Render ----
            function render() {
                const el = $('#app');
                if (!el) return;
                const views = {
                    dashboard: viewDashboard,
                    customers: viewCustomerList,
                    customer: () => viewCustomerProfile(route.params.id),
                    wizard: viewWizard,
                    reminders: viewReminders,
                    settings: viewSettings
                };
                el.innerHTML = (views[route.name] || views.dashboard)();
                document.querySelectorAll('#tabbar [data-route]').forEach(b => {
                    b.classList.toggle('active', b.dataset.route === route.name);
                });
                if (route.name === 'wizard' && draft) {
                    document.querySelectorAll('[data-bind]').forEach(inp => {
                        const val = getPath(draft, inp.dataset.bind);
                        if (inp.type === 'checkbox') inp.checked = !!val;
                        else if (inp.value !== (val || '')) inp.value = val || '';
                    });
                }
                updateBadge();
            }

            function updateBadge() {
                const rems = DB.reminders.map(r => ({ ...r, _status: reminderStatus(r) }));
                const overdue = rems.filter(r => r._status === 'overdue').length;
                const tab = document.querySelector('#tabbar [data-route="reminders"]');
                if (tab) {
                    const existing = tab.querySelector('.badge-dot');
                    if (overdue > 0) {
                        if (!existing) { const dot = document.createElement('span');
                            dot.className = 'badge-dot';
                            tab.appendChild(dot); }
                    } else if (existing) existing.remove();
                }
            }

            function updateTabActive() {
                document.querySelectorAll('#tabbar [data-route]').forEach(b => {
                    b.classList.toggle('active', b.dataset.route === route.name);
                });
            }

            // ---- Boot ----
            (async function boot() {
                // Load data
                await loadDB();

                // Native: reschedule all reminders on boot (handled by Android)
                if (IS_NATIVE) {
                    await rescheduleNativeReminders();
                } else {
                    // Browser: check missed on load
                    checkMissedOnLoadBrowser();
                    // Start interval checker
                    setInterval(checkDueRemindersBrowser, 30000);
                    checkDueRemindersBrowser();
                }

                // Draft resume prompt
                const hasDraft = !!localStorage.getItem(DRAFT_KEY);
                if (hasDraft && route.name !== 'wizard') {
                    setTimeout(() => { render(); }, 100);
                }

                render();
                setInterval(updateBadge, 10000);
                updateBadge();

                // Native bridge ready notification
                if (IS_NATIVE) {
                    console.log('H4 Note Pad running in NATIVE Android mode');
                    toast('📱 Native Android mode — reliable reminders enabled');
                } else {
                    console.log('H4 Note Pad running in BROWSER mode');
                }
            })();

            // Expose for inline event handlers
            window._render = render;
            window._toast = toast;

        })();
    </script>

    <!-- ============================================================
    ANDROID NATIVE BRIDGE STUB (for browser mode)
    ============================================================ -->
    <script>
        // This stub is replaced by the actual Android bridge (H4Bridge) in native mode.
        // It exists only to prevent undefined errors in the browser.
        if (typeof H4Bridge === 'undefined') {
            window.H4Bridge = {
                loadAllData: function(params) { return JSON.stringify({ error: 'Not in native mode' }); },
                saveAllData: function(params) { return JSON.stringify({ success: false, error: 'Not in native mode' }); },
                scheduleReminder: function(params) { return JSON.stringify({ success: false,
                        error: 'Not in native mode' }); },
                cancelReminder: function(params) { return JSON.stringify({ success: false,
                        error: 'Not in native mode' }); },
                rescheduleAllReminders: function(params) { return JSON.stringify({ success: false,
                        error: 'Not in native mode' }); },
                makeCall: function(params) { return JSON.stringify({ success: false, error: 'Not in native mode' }); },
                openWhatsApp: function(params) { return JSON.stringify({ success: false,
                        error: 'Not in native mode' }); },
                testReminder: function(params) { return JSON.stringify({ success: false,
                    error: 'Not in native mode' }); }
            };
        }
    </script>
