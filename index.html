<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>H4 Note Pad</title>
<style>
:root{
  --bg:#0B0F14; --card:#121923; --input:#18212C; --line:#232C38;
  --text:#FFFFFF; --text2:#AAB4C0; --text3:#6B7686;

  --customer:#3B82F6; --customer-grad:linear-gradient(135deg,#3B82F6,#6366F1);
  --item:#8B5CF6;     --item-grad:linear-gradient(135deg,#8B5CF6,#A855F7);
  --contact:#06B6D4;  --contact-grad:linear-gradient(135deg,#06B6D4,#0EA5E9);
  --notes:#F59E0B;    --notes-grad:linear-gradient(135deg,#F59E0B,#F97316);
  --followup:#F97316; --followup-grad:linear-gradient(135deg,#F97316,#FB923C);
  --reminder:#EF4444; --reminder-grad:linear-gradient(135deg,#EF4444,#F43F5E);
  --history:#22C55E;  --history-grad:linear-gradient(135deg,#22C55E,#16A34A);

  --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{overscroll-behavior:none;}
button, input, select, textarea{font-family:inherit;}
#shell{max-width:1100px; margin:0 auto; min-height:100dvh; min-height:100vh; display:flex; flex-direction:column;}
#app{flex:1; padding:14px 14px 90px;}
a{color:inherit;}

.h-title{font-size:20px; font-weight:800; margin:2px 0 2px;}
.h-sub{font-size:13px; color:var(--text2); margin:0 0 16px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; color:var(--text2); margin-bottom:6px; font-weight:600;}
.field .req{color:var(--reminder);}
.field input[type=text], .field input[type=tel], .field input[type=date], .field input[type=time], .field input[type=number], .field select, .field textarea{
  width:100%; background:var(--input); border:1px solid var(--line); color:var(--text);
  border-radius:12px; padding:14px 14px; font-size:16px; min-height:52px;
}
.field textarea{min-height:90px; max-height:300px; overflow-y:auto; resize:vertical; line-height:1.4;}
.field textarea.lg{min-height:150px; max-height:420px;}
.field textarea.xl{min-height:180px; max-height:520px;}
.field .hint{font-size:11px; color:var(--text3); margin-top:5px;}
.field .warn{font-size:12px; color:#F59E0B; margin-top:5px;}
.field .err{font-size:12px; color:#FF6B6B; margin-top:5px; display:none;}
.field.invalid input, .field.invalid select{border-color:#FF6B6B;}
.field.invalid .err{display:block;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px; padding:14px 20px; font-size:15px; font-weight:700; min-height:52px; background:var(--input); color:var(--text); width:100%;}
.btn.primary{background:var(--customer-grad); color:#fff;}
.btn.danger{background:var(--reminder-grad); color:#fff;}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text2);}
.btn.sm{min-height:38px; padding:8px 14px; font-size:12.5px; width:auto;}
.btn:disabled{opacity:.4;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px;}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

.topbar{display:flex; align-items:center; gap:10px; padding:14px 0 10px; position:sticky; top:0; background:var(--bg); z-index:5;}
.topbar .back{background:var(--card); border:1px solid var(--line); color:var(--text); width:40px; height:40px; border-radius:12px; font-size:18px; flex-shrink:0;}
.topbar h1{font-size:18px; margin:0; font-weight:800; flex:1;}
.topbar .tb-act{background:var(--card); border:1px solid var(--line); color:var(--text); width:40px; height:40px; border-radius:12px; font-size:16px; flex-shrink:0; position:relative;}
.tb-act .cnt{position:absolute; top:-4px; right:-4px; background:var(--reminder); color:#fff; font-size:9px; font-weight:800; border-radius:10px; padding:1px 5px; min-width:16px;}

#tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:#0E1319; border-top:1px solid var(--line); display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); max-width:1100px; margin:0 auto;}
#tabbar button{flex:1; background:none; border:none; color:var(--text3); display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px; font-size:10px; font-weight:700; border-radius:12px;}
#tabbar button .tic{font-size:19px;}
#tabbar button.active{color:var(--text);}
#tabbar button.fab{position:relative; top:-14px;}
#tabbar button.fab .tic{width:48px; height:48px; border-radius:50%; background:var(--customer-grad); display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; box-shadow:0 6px 18px rgba(59,130,246,.5);}
body.wizard-mode #tabbar{display:none;}
body.wizard-mode #app{padding-bottom:16px;}

.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px;}
@media(min-width:600px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
.stat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; border-top:3px solid transparent;}
.stat-card .num{font-size:24px; font-weight:800;}
.stat-card .lbl{font-size:11px; color:var(--text2); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.stat-total{border-top-color:var(--customer);}
.stat-overdue{border-top-color:var(--reminder);}
.stat-today{border-top-color:var(--followup);}
.stat-upcoming{border-top-color:#3B82F6;}
.stat-followup{border-top-color:var(--followup);}
.stat-completed{border-top-color:var(--history);}

.missed-banner{background:linear-gradient(135deg,#3a0d0d,#1c0808); border:1px solid #5a1616; border-radius:var(--r); padding:14px; margin-bottom:16px;}
.missed-banner .mb-head{display:flex; align-items:center; gap:8px; font-weight:800; color:#FF8080; margin-bottom:8px;}
.missed-item{background:rgba(255,255,255,.04); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
.missed-item:last-child{margin-bottom:0;}
.missed-item .mi-top{display:flex; justify-content:space-between; font-size:13px; font-weight:700;}
.missed-item .mi-sub{font-size:12px; color:var(--text2); margin:3px 0 8px;}
.dismiss-note{font-size:10.5px; color:var(--text3); margin-top:8px;}

.next-action-card{border-radius:var(--r); padding:16px; margin-bottom:16px; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--reminder);}
.next-action-card .na-tag{font-size:11px; font-weight:800; color:var(--reminder); letter-spacing:.06em; margin-bottom:6px;}
.next-action-card .na-title{font-size:16px; font-weight:800; margin-bottom:4px;}
.next-action-card .na-meta{font-size:12px; color:var(--text2); margin-bottom:12px;}

.section-head{display:flex; justify-content:space-between; align-items:center; margin:22px 0 10px;}
.section-head h2{font-size:14px; margin:0; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--text2);}
.section-head a{font-size:12px; color:var(--customer); font-weight:700;}

.reminder-status-widget{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:16px;}
.reminder-status-widget .rsw-l{font-size:13px; font-weight:700;}
.reminder-status-widget .rsw-status{font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px;}

.list-row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;}
.avatar{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; flex-shrink:0; font-size:16px; overflow:hidden;}
.avatar img{width:100%; height:100%; object-fit:cover;}
.list-row .lr-body{flex:1; min-width:0;}
.list-row .lr-title{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px;}
.list-row .lr-sub{font-size:12px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-row .lr-arrow{color:var(--text3); font-size:18px;}
.archived-tag{font-size:9px; background:var(--line); color:var(--text3); padding:2px 6px; border-radius:8px; font-weight:700;}
.search-row{display:flex; gap:8px; margin-bottom:10px;}
.search-box{flex:1;}
.search-box input{width:100%; background:var(--input); border:1px solid var(--line); color:var(--text); border-radius:14px; padding:13px 14px; font-size:15px;}
.empty-state{text-align:center; color:var(--text3); padding:50px 20px; font-size:13px;}
.empty-state .ic{font-size:34px; margin-bottom:10px;}
.filter-chip-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; -webkit-overflow-scrolling:touch;}
.filter-chip-row::-webkit-scrollbar{display:none;}

.cat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
@media(min-width:600px){.cat-grid{grid-template-columns:repeat(3,1fr);}}
.cat-card{position:relative; background:var(--input); border:2px solid var(--line); border-radius:14px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text); min-height:78px; justify-content:center;}
.cat-card .cat-ic{font-size:22px;}
.cat-card .cat-lbl{font-size:12px; font-weight:700; text-align:center; line-height:1.25;}
.cat-card.selected{border-color:var(--acc,var(--customer)); background:color-mix(in srgb, var(--acc,var(--customer)) 14%, var(--input));}
.cat-card .cat-check{position:absolute; top:6px; right:8px; font-size:13px; color:var(--acc,var(--customer)); font-weight:900;}

.item-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media(min-width:600px){.item-grid{grid-template-columns:repeat(3,1fr);}}
.item-card{position:relative; background:var(--input); border:2px solid var(--line); border-radius:16px; padding:16px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; min-height:110px; justify-content:center;}
.item-card.selected{border-color:var(--item); background:color-mix(in srgb, var(--item) 14%, var(--input));}
.item-card .ic-thumb{width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden; background:rgba(255,255,255,.05);}
.item-card .ic-thumb img{width:100%; height:100%; object-fit:cover;}
.item-card .ic-name{font-size:12px; font-weight:700; text-align:center;}
.item-card .ic-check{position:absolute; top:8px; right:10px; color:var(--item); font-weight:900;}
.item-card.add-new{border-style:dashed; color:var(--text2);}

.inline-form{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px;}
.thumb-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
.thumb{position:relative; width:70px; height:70px; border-radius:12px; overflow:hidden; background:var(--input); border:1px solid var(--line);}
.thumb img{width:100%; height:100%; object-fit:cover;}
.thumb .rm{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:11px;}
.add-thumb{width:70px; height:70px; border-radius:12px; border:1.5px dashed var(--line); background:none; color:var(--text2); font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-direction:column; gap:2px;}
.add-thumb span{font-size:8px; font-weight:700;}
.file-chip{display:flex; align-items:center; gap:8px; background:var(--input); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-top:6px; font-size:12px;}
.file-chip .fname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.file-chip button{background:none; border:none; color:var(--text3); font-size:13px;}

.photo-upload{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.photo-circle{width:64px; height:64px; border-radius:50%; background:var(--input); border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:22px; overflow:hidden; flex-shrink:0; cursor:pointer;}
.photo-circle img{width:100%; height:100%; object-fit:cover;}

.switch-row{display:flex; align-items:center; justify-content:space-between; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; gap:10px;}
.switch-row .sr-label{font-weight:700; font-size:14px;}
.switch-row .sr-sub{font-size:11px; color:var(--text2); margin-top:2px;}
.switch{position:relative; width:48px; height:28px; flex-shrink:0;}
.switch input{opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:20px; transition:.15s;}
.switch .knob{position:absolute; top:3px; left:3px; width:22px; height:22px; background:#fff; border-radius:50%; transition:.15s;}
.switch input:checked + .track{background:var(--history-grad);}
.switch input:checked ~ .knob{transform:translateX(20px);}

.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{background:var(--input); border:1.5px solid var(--line); color:var(--text2); border-radius:20px; padding:9px 15px; font-size:12.5px; font-weight:700;}
.chip.selected{border-color:var(--acc,var(--reminder)); color:#fff; background:color-mix(in srgb, var(--acc,var(--reminder)) 25%, var(--input));}

.wiz-top{padding:14px 0 6px;}
.wiz-top-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.wiz-close{background:var(--card); border:1px solid var(--line); color:var(--text); width:38px; height:38px; border-radius:12px; font-size:16px;}
.wiz-step-lbl{font-size:12px; color:var(--text2); font-weight:700;}
.wiz-progress{height:7px; background:var(--input); border-radius:6px; overflow:hidden; margin-bottom:16px;}
.wiz-progress-fill{height:100%; border-radius:6px; transition:width .25s;}
.wiz-head{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.wiz-head .wi{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:21px; color:#fff; flex-shrink:0;}
.wiz-head h2{margin:0; font-size:18px; font-weight:800;}
.wiz-head p{margin:2px 0 0; font-size:12px; color:var(--text2);}
.wiz-nav{display:flex; gap:10px; margin-top:22px;}
.wiz-nav .btn{flex:1;}
.dup-banner{background:linear-gradient(135deg,#1b2a12,#0f1a0c); border:1px solid #35521f; border-radius:14px; padding:12px 14px; margin-top:8px;}
.dup-banner .db-title{font-weight:800; color:#8FE28F; font-size:12.5px; margin-bottom:6px;}
.dup-banner .db-name{font-size:13.5px; font-weight:700; margin-bottom:10px;}

.timeline{position:relative; padding-left:22px;}
.timeline::before{content:''; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:var(--line);}
.tl-item{position:relative; margin-bottom:16px;}
.tl-item::before{content:''; position:absolute; left:-22px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--acc,var(--customer)); border:2px solid var(--bg);}
.tl-item .tl-time{font-size:11px; color:var(--text3); font-weight:700; margin-bottom:3px;}
.tl-item .tl-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px;}
.tl-item .tl-title{font-size:13px; font-weight:700; margin-bottom:3px;}
.tl-item .tl-body{font-size:12.5px; color:var(--text2); white-space:pre-wrap; line-height:1.45;}
.tl-item .tl-imgs{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.tl-item .tl-imgs img{width:54px; height:54px; border-radius:8px; object-fit:cover;}

.profile-hero{border-radius:var(--r); padding:20px 16px; margin-bottom:14px; position:relative; overflow:hidden;}
.profile-hero .ph-avatar{width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; margin-bottom:10px; overflow:hidden;}
.profile-hero .ph-avatar img{width:100%; height:100%; object-fit:cover;}
.profile-hero h1{margin:0; font-size:20px; font-weight:800; display:flex; align-items:center; gap:8px;}
.profile-hero .ph-cat{font-size:12.5px; opacity:.9; margin-top:2px;}
.quick-actions{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:14px 0 18px;}
.qa-btn{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text); font-size:9.5px; font-weight:700;}
.qa-btn .ic{font-size:18px;}

.rem-group-title{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; margin:18px 0 10px;}
.rem-card{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--reminder); border-radius:14px; padding:13px 14px; margin-bottom:10px;}
.rem-card .rc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.rem-card .rc-name{font-weight:800; font-size:14px;}
.rem-card .rc-reason{font-size:12.5px; color:var(--text2); margin:4px 0 8px;}
.rem-card .rc-time{font-size:11px; color:var(--text3); font-weight:700;}
.rem-card .rc-links{font-size:11px; margin-top:6px; display:flex; gap:10px;}
.rem-card .rc-links a{color:var(--customer); font-weight:700;}
.rem-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
.rem-actions button{flex:1; min-width:70px; background:var(--input); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 6px; font-size:11px; font-weight:700;}

.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:60; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{background:var(--bg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head h3{margin:0; font-size:16px; font-weight:800;}
.modal-head .x{background:var(--card); border:1px solid var(--line); color:var(--text); width:34px; height:34px; border-radius:10px; font-size:15px;}
.snooze-opts{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.snooze-opts button{background:var(--input); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:14px 8px; font-weight:700; font-size:13px;}

.diag-row{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.diag-row:last-child{border-bottom:none;}
.diag-row .dg{font-size:16px;}
.diag-row .dg-label{font-weight:700; font-size:13px;}
.diag-row .dg-note{font-size:11.5px; color:var(--text2); margin-top:2px;}
.sound-row{display:flex; align-items:center; gap:8px; background:var(--input); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
.sound-row .snd-name{flex:1; font-size:13px; font-weight:700;}
.sound-row button{background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 10px; font-size:11px; font-weight:700;}

.toast{position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#1a222c; border:1px solid var(--line); color:#fff; padding:10px 16px; border-radius:20px; font-size:12.5px; z-index:90; opacity:0; transition:opacity .25s; font-weight:600; max-width:88vw; text-align:center;}
.toast.show{opacity:1;}
.small-muted{font-size:11px; color:var(--text3); line-height:1.5;}
.native-note{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--reminder); border-radius:var(--r); padding:14px; margin-bottom:16px;}
.native-note b{color:var(--text);}
</style>
</head>
<body>
<div id="shell">
  <div id="app"></div>
  <nav id="tabbar">
    <button data-act="nav" data-route="dashboard"><span class="tic">🏠</span>Home</button>
    <button data-act="nav" data-route="customers"><span class="tic">👥</span>Customers</button>
    <button class="fab" data-act="startWizard"><span class="tic">➕</span></button>
    <button data-act="nav" data-route="reminders"><span class="tic">🔔</span>Reminders</button>
    <button data-act="nav" data-route="settings"><span class="tic">⚙️</span>Settings</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const $all = s => Array.from(document.querySelectorAll(s));

/* ============================================================
   DATA MODEL
============================================================ */
const LS_KEY = 'h4np_data_v2';
const DRAFT_KEY = 'h4np_draft_v2';

function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtTime(hhmm){ if(!hhmm) return ''; const [h,m]=hhmm.split(':').map(Number); const ap=h>=12?'PM':'AM'; const h12=((h+11)%12)+1; return h12+':'+String(m).padStart(2,'0')+' '+ap; }
function combineDT(dateIso, hhmm){ if(!dateIso||!hhmm) return null; return new Date(dateIso+'T'+hhmm+':00'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nl2br(s){ return escapeHtml(s||'').replace(/\n/g,'<br>'); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function validMobile(v){ return /^[6-9]\d{9}$/.test((v||'').trim()); }
function relTime(iso){
  if(!iso) return 'a while ago';
  const s = Math.round((Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.round(s/60)+' min ago';
  if(s<86400) return Math.round(s/3600)+' hr ago';
  return Math.round(s/86400)+' day(s) ago';
}

/* ============================================================
   REMINDER STATUS ENGINE  (Pending → Due/Today/Upcoming/Overdue/Missed → Snoozed → Completed)
============================================================ */
function pushHistory(r, event){ r.history = r.history||[]; r.history.push({ts:new Date().toISOString(), event}); }

function reminderStatus(r){
  const now = new Date();
  if(r.status==='completed') return 'completed';
  if(r.status==='missed') return 'missed';
  if(r.snoozeMarker && r.snoozeUntil && new Date(r.snoozeUntil) > now) return 'snoozed';
  const dt = combineDT(r.date, r.time);
  if(!dt) return 'upcoming';
  if(now < dt) return dt.toDateString()===now.toDateString() ? 'today' : 'upcoming';
  const graceMs = 5*60000;
  if(now - dt <= graceMs) return 'due';
  return 'overdue';
}
const STATUS_META = {
  upcoming:{label:'Upcoming', color:'#3B82F6', dot:'🔵'},
  today:{label:'Today', color:'#F97316', dot:'🟠'},
  due:{label:'Due Now', color:'#EF4444', dot:'🔴'},
  overdue:{label:'Overdue', color:'#EF4444', dot:'🔴'},
  missed:{label:'Missed', color:'#B91C1C', dot:'⛔'},
  snoozed:{label:'Snoozed', color:'#EAB308', dot:'🟡'},
  completed:{label:'Completed', color:'#22C55E', dot:'🟢'},
  rescheduled:{label:'Rescheduled', color:'#22C55E', dot:'📅'}
};

/* Missed detection: a reminder is "Missed" only when this app/tab was not open
   at (or past) its scheduled time — i.e. the device/browser was unavailable to
   fire it — never just because the app happened to stay open past due time. */
function detectMissedReminders(){
  const now = new Date();
  const last = DB.meta.lastActiveAt ? new Date(DB.meta.lastActiveAt) : null;
  const wasAway = !last || (now - last) > 3*60000;
  if(wasAway){
    DB.reminders.forEach(r=>{
      if(r.status==='pending'){
        const effectiveDT = (r.snoozeMarker && r.snoozeUntil) ? new Date(r.snoozeUntil) : combineDT(r.date,r.time);
        if(effectiveDT && effectiveDT < now){
          r.status='missed'; r.snoozeMarker=false;
          pushHistory(r, 'Missed — app/browser was not open at the scheduled time');
        }
      }
    });
  }
  DB.meta.lastActiveAt = now.toISOString();
  saveDB();
}

function notifyAtForReminder(r){
  const dt = combineDT(r.date, r.time);
  if(!dt) return null;
  const mins = parseInt(r.remindBefore||'0',10);
  return new Date(dt.getTime() - mins*60000);
}

function checkDueReminders(){
  const s = DB.settings;
  DB.meta.lastActiveAt = new Date().toISOString();
  if(!s.enableReminders) return;
  const now = new Date();
  let changed=false;
  DB.reminders.forEach(r=>{
    if(r.status!=='pending') return; // snoozed reminders keep status 'pending', so they ARE re-checked here
    const notifyAt = notifyAtForReminder(r);
    if(!notifyAt) return;
    if(now >= notifyAt && !r._notified){
      r._notified = true; changed = true;
      fireReminderAlert(r);
    }
  });
  if(changed) saveDB();
}
function fireReminderAlert(r){
  const s = DB.settings;
  const c = DB.customers.find(x=>x.id===r.customerId);
  const dt = combineDT(r.date, r.time);
  const notifyAt = notifyAtForReminder(r);
  const showsBoth = notifyAt && dt && Math.abs(notifyAt-dt) > 60000;
  const bodyLines = [`${c?c.name:'Customer'} — ${r.reason||'Reminder'}`];
  if(showsBoth) bodyLines.push(`Notify: ${fmtTime(notifyAt.toTimeString().slice(0,5))}  ·  Action time: ${fmtTime(r.time)}`);
  else bodyLines.push(`⏰ ${fmtTime(r.time)}`);
  if(s.showNotification && window.Notification && Notification.permission==='granted'){
    try{ new Notification('🔔 Customer Reminder', {body: bodyLines.join('\n')}); }catch(e){}
  }
  if(s.vibration && navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
  if(s.soundOn) playSound(r.soundId || s.defaultSoundId);
  if(s.showPopup) toast('🔔 Reminder: '+(c?c.name:'Customer')+' — '+(r.reason||''));
}
setInterval(checkDueReminders, 30000);

function playSound(soundId){
  const custom = DB.sounds.find(x=>x.id===soundId);
  if(custom && custom.dataUrl){
    try{ const a = new Audio(custom.dataUrl); a.volume = (DB.settings.volume||80)/100; a.play().catch(()=>{}); }catch(e){}
  } else {
    // Built-in tones have no shipped audio asset in this browser build — the native
    // app would map these to real ringtone resources. We're honest about that here.
    toast('🔊 "'+ (BUILTIN_SOUNDS.find(b=>b.id===soundId)||{name:soundId}).name +'" would play (built-in tones need the native app to actually sound).');
  }
}

============================================================ */
function nextOccurrenceDate(dateStr, repeat){
  const d = new Date(dateStr+'T00:00:00');
  if(repeat==='daily') d.setDate(d.getDate()+1);
  else if(repeat==='weekly') d.setDate(d.getDate()+7);
  else if(repeat==='monthly') d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function createNextOccurrence(r){
  const nd = uid('rem');
  DB.reminders.push({
    id:nd, customerId:r.customerId, contactId:r.contactId||null, noteId:r.noteId||null, followupId:r.followupId||null,
    date: nextOccurrenceDate(r.date, r.repeat), time:r.time, reason:r.reason, method:r.method, priority:r.priority,
    repeat:r.repeat, remindBefore:r.remindBefore, soundId:r.soundId,
    scheduledLocalDate:null, scheduledLocalTime:null, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    status:'pending', snoozeMarker:false, snoozeUntil:null,
    history:[{ts:new Date().toISOString(), event:'Created — recurring from '+r.id}], createdAt:new Date().toISOString()
  });
  const created = DB.reminders[DB.reminders.length-1];
  created.scheduledLocalDate = created.date; created.scheduledLocalTime = created.time;
  return created;
}

function customerHaystack(c){
  const items = (c.items||[]).map(id=>DB.items.find(i=>i.id===id)).filter(Boolean).map(i=>i.name);
  const contacts = DB.contacts.filter(x=>x.customerId===c.id);
  const notes = DB.notes.filter(x=>x.customerId===c.id);
  const reminders = DB.reminders.filter(x=>x.customerId===c.id);
  return [
    c.name, c.mobile, c.whatsapp, categoryLabel(DB.customCategories,c.category), c.address, c.location,
    ...items,
    ...contacts.map(x=>categoryLabel(CONTACT_CATEGORIES,x.category)+' '+x.details),
    ...notes.map(x=>x.title+' '+x.body),
    ...reminders.map(x=>x.reason)
  ].join(' ').toLowerCase();
}

  `;
}

function viewCustomerProfile(id){

  const contacts = DB.contacts.filter(x=>x.customerId===id);
  const notes = DB.notes.filter(x=>x.customerId===id);
  const followups = DB.followups.filter(x=>x.customerId===id);
  const reminders = DB.reminders.filter(x=>x.customerId===id).map(r=>({...r,_status:reminderStatus(r)}));

  const lastContact = contacts.slice().sort((a,b)=>(combineDT(b.date,b.time)||new Date(b.createdAt)) - (combineDT(a.date,a.time)||new Date(a.createdAt)))[0];

  let timelineEntries = [

      title:`${categoryLabel(CONTACT_CATEGORIES,x.category)} · ${categoryLabel(CONTACT_METHODS,x.method)}`, body:x.details})),
    ...notes.map(x=>({type:'note', accent:'notes', ts:x.createdAt, icon:'📝',
      title:x.title||'Note', body:x.body, images:x.images, attachments:x.attachments})),

    ...reminders.map(x=>({type:'reminder', accent:'reminder', ts:(combineDT(x.date,x.time)||new Date(x.createdAt)).toISOString(), icon:'🔔',
      title:`Reminder — ${STATUS_META[x._status].label}`, body:`${fmtDate(x.date)} ${fmtTime(x.time)} · ${x.reason||''}`}))

  <div class="quick-actions">

    <button class="qa-btn" data-act="openAddNote" data-id="${c.id}"><span class="ic">📝</span>Note</button>
    <button class="qa-btn" data-act="openAddContact" data-id="${c.id}"><span class="ic">➕</span>Contact</button>

  ${nextRem ? `

  ${lastContact ? `

/* ============================================================
   VIEW: REMINDERS BOARD
============================================================ */
function viewReminders(){
  let rems = DB.reminders.map(r=>({...r,_status:reminderStatus(r)}));
  if(remFilter.priority) rems = rems.filter(r=>r.priority===remFilter.priority);
  if(remFilter.from) rems = rems.filter(r=>r.date>=remFilter.from);
  if(remFilter.to) rems = rems.filter(r=>r.date<=remFilter.to);
  const groups = [
    ['missed','⛔ Missed'], ['overdue','🔴 Overdue'], ['due','🔴 Due Now'], ['today','🟠 Today'], ['snoozed','🟡 Snoozed'],
    ['upcoming','🔵 Upcoming'], ['completed','🟢 Completed']
  ];
  const activeFilterCount = (remFilter.priority?1:0)+(remFilter.from?1:0)+(remFilter.to?1:0);
  let html = topbar('Reminders', null, `<button class="tb-act" data-act="openReminderFilter">🔎${activeFilterCount?`<span class="cnt">${activeFilterCount}</span>`:''}</button>`);
  let any=false;
  groups.forEach(([key,label])=>{
    const list = rems.filter(r=>r._status===key).sort((a,b)=>combineDT(a.date,a.time)-combineDT(b.date,b.time));
    if(!list.length) return;
    any=true;
    html += `<div class="rem-group-title">${label} — ${list.length}</div>`;
    html += list.map(r=>reminderCard(r)).join('');
  });
  if(!any) html += emptyState('🔔','No reminders match','Reminders you create from a customer will show up here.');
  return html;
}
function reminderCard(r){
  const c = DB.customers.find(x=>x.id===r.customerId);
  const meta = STATUS_META[r._status];
  const done = r._status==='completed';
  const notifyAt = notifyAtForReminder(r);
  const dt = combineDT(r.date,r.time);
  const showsBoth = notifyAt && dt && Math.abs(notifyAt-dt) > 60000;
  return `<div class="rem-card" style="border-left-color:${meta.color}">
    <div class="rc-top">
      <div>
        <div class="rc-name">${escapeHtml(c?c.name:'Unknown')} ${c?`— ${categoryLabel(DB.customCategories,c.category)}`:''}</div>
        <div class="rc-reason">${methodIcon(r.method)} ${escapeHtml(r.reason||'Reminder')}</div>
      </div>
      <span class="badge" style="background:${meta.color}22; color:${meta.color}">${meta.dot} ${meta.label}</span>
    </div>
    <div class="rc-time">📅 ${fmtDate(r.date)} · ⏰ ${fmtTime(r.time)} ${r.priority?('· '+r.priority):''}
      ${showsBoth?`<br>🔔 Notify ${fmtTime(notifyAt.toTimeString().slice(0,5))} · Action ${fmtTime(r.time)}`:''}
    </div>
    ${(r.noteId||r.contactId)?`<div class="rc-links">${c?`<a data-act="nav" data-route="customer" data-id="${c.id}">👤 View Customer</a>`:''}</div>`:''}
    ${!done ? `<div class="rem-actions">
      <button data-act="callCustomer" data-id="${c?c.id:''}">📞 Call</button>
      <button data-act="openComplete" data-id="${r.id}">✅ Complete</button>
      <button data-act="openSnooze" data-id="${r.id}">⏰ Snooze</button>
      <button data-act="openReschedule" data-id="${r.id}">📅 Reschedule</button>
    </div>` : ''}
  </div>`;
}

function diagnosticsHtml(){

    {ic: notifOk?'🟢':'🔴', label:'Notifications', note: notifOk?'Enabled':'Grant permission above'},

    {ic: s.soundOn?'🟢':'🔴', label:'Sound', note: s.soundOn?'Enabled in settings':'Turned off in settings'},
    {ic:'⚪', label:'Works while app/phone is fully closed', note:'Not possible from a web page — needs the native Android app (AlarmManager + boot receiver)'},

function renderModal(){
  const root = $('#modalRoot');
  if(!modal){ root.innerHTML=''; return; }
  let inner = '';
  if(modal.type==='addNote') inner = modalAddNote();
  if(modal.type==='addContact') inner = modalAddContact();
  if(modal.type==='addReminder') inner = modalAddReminder();
  if(modal.type==='snooze') inner = modalSnooze();
  if(modal.type==='reschedule') inner = modalReschedule();
  if(modal.type==='complete') inner = modalComplete();
  if(modal.type==='customerFilter') inner = modalCustomerFilter();
  if(modal.type==='reminderFilter') inner = modalReminderFilter();
  if(modal.type==='duplicateConfirm') inner = modalDuplicateConfirm();
  if(modal.type==='editItem') inner = modalEditItem();
  if(modal.type==='editCategory') inner = modalEditCategory();
  if(modal.type==='renameSound') inner = modalRenameSound();
  root.innerHTML = `<div class="modal-bg" data-act="closeModalBg"><div class="modal-sheet" onclick="event.stopPropagation()">${inner}</div></div>`;
  autoGrowAll();
}

/* ============================================================
   IMAGE / FILE HANDLING
============================================================ */
function compressImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    try{
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          let w=img.width, h=img.height;
          if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
          else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
          const canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality||0.75));
        };
        img.onerror = ()=>reject(new Error('bad image'));
        img.src = ev.target.result;
      };
      reader.onerror = ()=>reject(new Error('read failed'));
      reader.readAsDataURL(file);
    }catch(e){ reject(e); }
  });
}
function readAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
function handleNoteImages(fileList, targetArr){
  const isModalTarget = modal && modal.data && modal.data.images === targetArr;
  Array.from(fileList).forEach(f=>{
    compressImage(f, 900, 0.75).then(dataUrl=>{
      targetArr.push(dataUrl);
      if(isModalTarget){ renderModal(); }
      else { if(draft && targetArr===draft.note.images) saveDraft(); render(); }
    }).catch(()=> toast('Could not process that photo'));
  });
}
function handleNoteDoc(file, targetArr){
  readAsDataUrl(file).then(dataUrl=>{
    targetArr.push({name:file.name, type:file.type, dataUrl});
    if(draft) saveDraft();
    render();
  }).catch(()=> toast('Could not attach that file'));
}
function autoGrowAll(){
  $all('textarea').forEach(t=>{
    t.style.height = 'auto';
    const max = parseFloat(getComputedStyle(t).maxHeight) || 9999;
    t.style.height = Math.min(t.scrollHeight, max) + 'px';
  });
}

function findCustomerByMobile(mobile){ return DB.customers.find(c=>c.mobile===mobile.trim()); }

function saveCustomerRecord(){
  const d = draft;
  if(!d.customer.name.trim() || !d.customer.category || !validMobile(d.customer.mobile)){
    toast('Please complete the Customer step first'); wStep=1; render(); return;
  }
  if(!d.forceNewDespiteDuplicate){
    const dup = findCustomerByMobile(d.customer.mobile);
    if(dup){ modal={type:'duplicateConfirm', data:{id:dup.id}}; renderModal(); return; }
  }
  finalizeCustomerRecord();
}
function forceSaveNewCustomer(){ draft.forceNewDespiteDuplicate = true; modal=null; renderModal(); finalizeCustomerRecord(); }

function finalizeCustomerRecord(){
  const d = draft;
  const customerId = uid('cust');
  const now = new Date().toISOString();
  DB.customers.push({ id:customerId, name:d.customer.name.trim(), category:d.customer.category,
    mobile:d.customer.mobile.trim(), whatsapp:d.customer.whatsapp.trim(), altMobile:d.customer.altMobile.trim(),
    address:d.customer.address.trim(), location:d.customer.location.trim(), items:d.items.selected.slice(),
    photo:d.customer.photo||null, status:'active', createdAt: now });

  let noteId = null;
  if(d.note.title.trim() || d.note.body.trim()){
    noteId = uid('note');
    DB.notes.push({ id:noteId, customerId, title:d.note.title.trim(), body:d.note.body.trim(),
      category:d.note.category, images:d.note.images.slice(), attachments:d.note.attachments.slice(), createdAt: now });
  }
  let contactId = null;
  if(d.contact.category || d.contact.method || d.contact.details.trim()){
    contactId = uid('cont');
    DB.contacts.push({ id:contactId, customerId, category:d.contact.category, method:d.contact.method,
      date:d.contact.date, time:d.contact.time, details:d.contact.details.trim(), createdAt: now });
  }
  let followupId=null;
  if(d.followup.required){
    followupId = uid('fu');
    DB.followups.push({ id:followupId, customerId, required:true, date:d.followup.date, time:d.followup.time,
      reason:d.followup.reason.trim(), method:d.followup.method, priority:d.followup.priority, createdAt: now });
  }
  if(d.reminder.create){
    const rid = uid('rem');
    DB.reminders.push({ id:rid, customerId, contactId, noteId, followupId,
      date:d.reminder.date, time:d.reminder.time, reason:d.reminder.reason.trim(), method:d.reminder.method,
      priority:d.reminder.priority, repeat:d.reminder.repeat, remindBefore:d.reminder.remindBefore, soundId:d.reminder.soundId,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, scheduledLocalDate:d.reminder.date, scheduledLocalTime:d.reminder.time,
      status:'pending', snoozeMarker:false, snoozeUntil:null,
      history:[{ts:now, event:'Created'}], createdAt: now });
  }

  saveDB(); clearDraft();
  toast('Customer record saved');
  nav('customer', {id:customerId});
}

function requestNotifPermission(){
  if(!window.Notification){ toast('Notifications are not supported in this browser'); return; }
  Notification.requestPermission().then(p=>{
    toast(p==='granted' ? 'Reminder notifications enabled' : 'Permission not granted');
    render();
  });
}
function testReminderNow(){
  const s = DB.settings;
  if(s.showNotification && window.Notification && Notification.permission==='granted'){
    try{ new Notification('🔔 Test Reminder', {body:'This is what a real reminder notification looks like.'}); }catch(e){}
  }
  if(s.vibration && navigator.vibrate) navigator.vibrate([200,100,200]);
  if(s.soundOn) playSound(s.defaultSoundId);
  if(s.showPopup) toast('🔔 Test reminder fired — check notification/vibration.');
}
