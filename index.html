<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>H4 Note Pad</title>
    <style>
        /* ===== ROOT & RESET (unchanged) ===== */
        :root {
            --bg: #0B0F14;
            --card: #121923;
            --input: #18212C;
            --line: #232C38;
            --text: #FFFFFF;
            --text2: #AAB4C0;
            --text3: #6B7686;
            --customer: #3B82F6;
            --customer-grad: linear-gradient(135deg, #3B82F6, #6366F1);
            --item: #8B5CF6;
            --item-grad: linear-gradient(135deg, #8B5CF6, #A855F7);
            --contact: #06B6D4;
            --contact-grad: linear-gradient(135deg, #06B6D4, #0EA5E9);
            --notes: #F59E0B;
            --notes-grad: linear-gradient(135deg, #F59E0B, #F97316);
            --followup: #F97316;
            --followup-grad: linear-gradient(135deg, #F97316, #FB923C);
            --reminder: #EF4444;
            --reminder-grad: linear-gradient(135deg, #EF4444, #F43F5E);
            --history: #22C55E;
            --history-grad: linear-gradient(135deg, #22C55E, #16A34A);
            --r: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            overscroll-behavior: none;
        }
        button,
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: inherit;
        }
        #shell {
            max-width: 1100px;
            margin: 0 auto;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        #app {
            flex: 1;
            padding: 12px 14px 90px;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 4px;
        }

        .h-title {
            font-size: 22px;
            font-weight: 800;
            margin: 4px 0 2px;
            letter-spacing: -0.3px;
        }
        .h-sub {
            font-size: 13px;
            color: var(--text2);
            margin: 0 0 14px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 14px;
        }
        .card-alt {
            background: var(--input);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 14px;
        }
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 12.5px;
            color: var(--text2);
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .field .req {
            color: var(--reminder);
        }
        .field input[type="text"],
        .field input[type="tel"],
        .field input[type="date"],
        .field input[type="time"],
        .field input[type="number"],
        .field select,
        .field textarea {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 12px;
            padding: 13px 14px;
            font-size: 15px;
            min-height: 50px;
            transition: border 0.15s;
        }
        .field textarea {
            min-height: 90px;
            resize: vertical;
            line-height: 1.5;
        }
        .field textarea.lg {
            min-height: 190px;
        }
        .field textarea.xl {
            min-height: 230px;
        }
        .field .hint {
            font-size: 11px;
            color: var(--text3);
            margin-top: 4px;
        }
        .field .err {
            font-size: 12px;
            color: #FF6B6B;
            margin-top: 4px;
            display: none;
        }
        .field.invalid input,
        .field.invalid select {
            border-color: #FF6B6B;
        }
        .field.invalid .err {
            display: block;
        }
        @media(min-width:700px) {
            .field textarea {
                min-height: 120px;
            }
            .field textarea.lg {
                min-height: 260px;
            }
            .field textarea.xl {
                min-height: 320px;
            }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 700;
            min-height: 52px;
            background: var(--input);
            color: var(--text);
            width: 100%;
            transition: opacity 0.15s, transform 0.1s;
            cursor: pointer;
            user-select: none;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn.primary {
            background: var(--customer-grad);
            color: #fff;
        }
        .btn.ghost {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text2);
        }
        .btn.sm {
            min-height: 36px;
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
        }
        .btn.danger {
            background: var(--reminder-grad);
            color: #fff;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn-row .btn {
            flex: 1;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--input);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .small-muted {
            font-size: 11.5px;
            color: var(--text3);
            line-height: 1.5;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .flex {
            display: flex;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-10 {
            gap: 10px;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0 10px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 5;
        }
        .topbar .back {
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 18px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .topbar h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 800;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .topbar .top-action {
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 18px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tabbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 40;
            background: #0E1319;
            border-top: 1px solid var(--line);
            display: flex;
            padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
            max-width: 1100px;
            margin: 0 auto;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }
        #tabbar button {
            flex: 1;
            background: none;
            border: none;
            color: var(--text3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 6px 2px;
            font-size: 9.5px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: color 0.15s;
            position: relative;
        }
        #tabbar button .tic {
            font-size: 18px;
        }
        #tabbar button.active {
            color: var(--text);
        }
        #tabbar button .badge-dot {
            position: absolute;
            top: 4px;
            right: 50%;
            transform: translateX(calc(50% + 12px));
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--reminder);
        }
        #tabbar button.fab {
            position: relative;
            top: -10px;
        }
        #tabbar button.fab .tic {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--customer-grad);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.5);
        }
        body.wizard-mode #tabbar {
            display: none;
        }
        body.wizard-mode #app {
            padding-bottom: 16px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        @media(min-width:600px) {
            .stat-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 14px;
            border-top: 3px solid transparent;
        }
        .stat-card .num {
            font-size: 24px;
            font-weight: 800;
        }
        .stat-card .lbl {
            font-size: 11px;
            color: var(--text2);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .stat-overdue {
            border-top-color: var(--reminder);
        }
        .stat-today {
            border-top-color: var(--followup);
        }
        .stat-upcoming {
            border-top-color: var(--customer);
        }
        .stat-completed {
            border-top-color: var(--history);
        }
        .stat-followups {
            border-top-color: var(--followup);
        }

        .missed-banner {
            background: linear-gradient(135deg, #3a0d0d, #1c0808);
            border: 1px solid #5a1616;
            border-radius: var(--r);
            padding: 14px;
            margin-bottom: 16px;
        }
        .missed-banner .mb-head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            color: #FF8080;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .missed-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .missed-item:last-child {
            margin-bottom: 0;
        }
        .missed-item .mi-top {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
        }
        .missed-item .mi-sub {
            font-size: 12px;
            color: var(--text2);
            margin: 3px 0 8px;
        }
        .missed-item .rem-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .missed-item .rem-actions button {
            flex: 1;
            min-width: 60px;
            background: var(--input);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 10px;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .next-action-card {
            border-radius: var(--r);
            padding: 16px;
            margin-bottom: 16px;
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 4px solid var(--reminder);
        }
        .next-action-card .na-tag {
            font-size: 11px;
            font-weight: 800;
            color: var(--reminder);
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }
        .next-action-card .na-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .next-action-card .na-meta {
            font-size: 12px;
            color: var(--text2);
            margin-bottom: 12px;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 10px;
        }
        .section-head h2 {
            font-size: 13px;
            margin: 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text2);
        }
        .section-head a {
            font-size: 12px;
            color: var(--customer);
            font-weight: 700;
            cursor: pointer;
        }

        .reminder-status-widget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .reminder-status-widget .rsw-l {
            font-size: 13px;
            font-weight: 700;
        }
        .reminder-status-widget .rsw-status {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .list-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .list-row:hover {
            border-color: var(--text3);
        }
        .list-row .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            font-size: 16px;
            overflow: hidden;
        }
        .list-row .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .list-row .lr-body {
            flex: 1;
            min-width: 0;
        }
        .list-row .lr-title {
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-row .lr-sub {
            font-size: 12px;
            color: var(--text2);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-row .lr-arrow {
            color: var(--text3);
            font-size: 18px;
        }
        .list-row .lr-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            background: var(--input);
            color: var(--text2);
        }

        .search-box {
            margin-bottom: 14px;
        }
        .search-box input {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 14px;
            padding: 13px 14px;
            font-size: 15px;
        }
        .search-box .filter-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .search-box .filter-row .filter-chip {
            background: var(--input);
            border: 1px solid var(--line);
            color: var(--text2);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .search-box .filter-row .filter-chip.active {
            border-color: var(--customer);
            color: var(--text);
            background: color-mix(in srgb, var(--customer) 20%, var(--input));
        }
        .search-box .filter-row .filter-chip.clear {
            border-color: var(--reminder);
            color: var(--reminder);
        }

        .empty-state {
            text-align: center;
            color: var(--text3);
            padding: 50px 20px;
            font-size: 13px;
        }
        .empty-state .ic {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media(min-width:600px) {
            .cat-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .cat-card {
            position: relative;
            background: var(--input);
            border: 2px solid var(--line);
            border-radius: 14px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--text);
            min-height: 78px;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .cat-card .cat-ic {
            font-size: 22px;
        }
        .cat-card .cat-lbl {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            line-height: 1.25;
        }
        .cat-card.selected {
            border-color: var(--acc, var(--customer));
            background: color-mix(in srgb, var(--acc, var(--customer)) 14%, var(--input));
        }
        .cat-card .cat-check {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 13px;
            color: var(--acc, var(--customer));
            font-weight: 900;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media(min-width:600px) {
            .item-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .item-card {
            position: relative;
            background: var(--input);
            border: 2px solid var(--line);
            border-radius: 16px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-height: 110px;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .item-card.selected {
            border-color: var(--item);
            background: color-mix(in srgb, var(--item) 14%, var(--input));
        }
        .item-card .ic-thumb {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
        }
        .item-card .ic-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-card .ic-name {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }
        .item-card .ic-check {
            position: absolute;
            top: 8px;
            right: 10px;
            color: var(--item);
            font-weight: 900;
        }
        .item-card.add-new {
            border-style: dashed;
            color: var(--text2);
        }

        .inline-form {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            margin-top: 12px;
        }
        .thumb-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .thumb {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--input);
            border: 1px solid var(--line);
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb .rm {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-thumb {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            border: 1.5px dashed var(--line);
            background: none;
            color: var(--text2);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-bottom: 14px;
            cursor: pointer;
        }
        .switch-row .sr-label {
            font-weight: 700;
            font-size: 14px;
        }
        .switch-row .sr-sub {
            font-size: 11px;
            color: var(--text2);
            margin-top: 2px;
        }
        .switch {
            position: relative;
            width: 48px;
            height: 28px;
            flex-shrink: 0;
        }
        .switch input {
            opacity: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            margin: 0;
            cursor: pointer;
            z-index: 2;
        }
        .switch .track {
            position: absolute;
            inset: 0;
            background: var(--line);
            border-radius: 20px;
            transition: 0.15s;
        }
        .switch .knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            transition: 0.15s;
            z-index: 1;
        }
        .switch input:checked+.track {
            background: var(--history-grad);
        }
        .switch input:checked~.knob {
            transform: translateX(20px);
        }

        .chip-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .chip {
            background: var(--input);
            border: 1.5px solid var(--line);
            color: var(--text2);
            border-radius: 20px;
            padding: 8px 14px;

        /**
         * ============================================================
         *  H4 NOTE PAD — HYBRID WEB + NATIVE ANDROID ARCHITECTURE
         *  ============================================================
         *  This script runs in two modes:
         *    1. BROWSER MODE  – uses localStorage, setInterval checks (30s)
         *    2. NATIVE MODE   – uses Android Bridge (H4Bridge) for:
         *       - Room/SQLite database
         *       - AlarmManager (exact, boot-recovery, battery-optimized)
         *       - Native notifications with actions, custom sounds, vibration
         *       - Missed-reminder detection on boot
         *
         *  The UI/UX remains IDENTICAL in both modes.  Only the storage
         *  and reminder engine change.
         * ============================================================
         */
        (function() {
            "use strict";

            // ---- Detect native mode ----
            const isNative = (typeof H4Bridge !== 'undefined' && H4Bridge !== null);
            const IS_NATIVE = isNative;
            const IS_BROWSER = !IS_NATIVE;

            // ---- Bridge helpers ----
            function nativeCall(method, params, callback) {
                if (!IS_NATIVE) {
                    if (callback) callback(null, { error: 'Not in native mode' });
                    return;
                }
                try {
                    const result = H4Bridge[method](JSON.stringify(params || {}));
                    if (callback) {
                        try { callback(null, JSON.parse(result)); } catch (e) { callback(null, { result: result }); }
                    }
                } catch (e) {
                    if (callback) callback(e, null);
                }
            }

            function nativeCallAsync(method, params) {
                return new Promise((resolve, reject) => {
                    nativeCall(method, params, (err, res) => {
                        if (err) reject(err);
                        else resolve(res);
                    });
                });
            }

            // ---- Constants ----
            const LS_KEY = 'h4np_data_v2';
            const DRAFT_KEY = 'h4np_draft_v2';

            function todayISO() { const d = new Date(); return d.toISOString().slice(0, 10); }

            function nowHHMM() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d
                    .getMinutes()).padStart(2, '0'); }

            function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return d
                    .toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }

            function fmtTime(hhmm) { if (!hhmm) return ''; const [h, m] = hhmm.split(':').map(Number); const ap = h >= 12 ?
                    'PM' : 'AM'; const h12 = ((h + 11) % 12) + 1; return h12 + ':' + String(m).padStart(2, '0') + ' ' + ap; }

            function combineDT(dateIso, hhmm) { if (!dateIso || !hhmm) return null; return new Date(dateIso + 'T' + hhmm +
                    ':00'); }

            function escapeHtml(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                        '"': '&quot;' } [c])); }

            function nl2br(s) { return escapeHtml(s || '').replace(/\n/g, '<br>'); }

            // ---- Image compression (browser only) ----
            function compressImage(file, maxDim, quality) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        const img = new Image();
                        img.onload = () => {
                            let w = img.width,
                                h = img.height;
                            if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w);
                                    w = maxDim; } } else { if (h > maxDim) { w = Math.round(w *
                                        maxDim / h);
                                    h = maxDim; } }
                            const canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
                        };
                        img.onerror = reject;
                        img.src = ev.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

                        else if (r.repeat === 'weekly') next.setDate(next.getDate() + 7);
                        else if (r.repeat === 'monthly') next.setMonth(next.getMonth() + 1);

            async function doSnooze(opt) {
                const r = DB.reminders.find(x => x.id === modal.data.id);
                if (!r) return;
                if (opt === 'custom') {
                    $('#customSnoozeBox').innerHTML = `
                <div class="field" style="margin-top:14px;"><label>Custom Date</label><input type="date" id="snoozeDate" value="${todayISO()}"></div>
                <div class="field"><label>Custom Time</label><input type="time" id="snoozeTime" value="${nowHHMM()}"></div>
                <button class="btn primary" data-act="doSnoozeCustom">Confirm Snooze</button>`;
                    return;
                }
                let until = new Date();
                if (opt === '1h') until = new Date(Date.now() + 3600000);
                else if (opt === 'tomorrow') {
                    until = new Date(Date.now() + 86400000);
                    const [h, m] = (r.time || '09:00').split(':').map(Number);
                    until.setHours(h, m, 0, 0);
                } else if (opt === '3d') until = new Date(Date.now() + 3 * 86400000);
                else if (opt === '7d') until = new Date(Date.now() + 7 * 86400000);
                await applySnooze(r, until);
            }

            async function applySnooze(r, untilDate) {
                r.status = 'snoozed';
                r.snoozeUntil = untilDate.toISOString();
                r._notified = false;
                pushHistory(r, 'Snoozed to ' + untilDate.toLocaleString());
                await saveDB();
                // Cancel old alarm, schedule new one at snooze time
                if (IS_NATIVE) {
                    await cancelNativeReminder(r.id);
                    // Schedule at the snooze time
                    const dt = combineDT(r.date, r.time);
                    if (dt) {
                        // Use the original date/time but with snooze offset
                        const newRem = { ...r };
                        newRem.date = untilDate.toISOString().slice(0, 10);
                        newRem.time = untilDate.toTimeString().slice(0, 5);
                        await scheduleNativeReminder(newRem);
                    }
                }
                modal = null;
                renderModal();
                toast('Reminder snoozed');
                render();

            // ---- Check due reminders (browser fallback) ----
            function checkDueRemindersBrowser() {
                if (IS_NATIVE) return; // Native handles this via AlarmManager
                const s = DB.settings;
                if (!s.enableReminders) return;
                const now = new Date();
                let changed = false;
                DB.reminders.forEach(r => {
                    if (r.status === 'completed' || r.status === 'snoozed') return;
                    const dt = combineDT(r.date, r.time);
                    if (!dt) return;
                    const remindMin = parseInt(r.remindBefore || '0', 10);
                    const fireAt = new Date(dt.getTime() - remindMin * 60000);
                    if (now >= fireAt && !r._notified) {
                        r._notified = true;
                        changed = true;
                        const c = DB.customers.find(x => x.id === r.customerId);
                        const title = `🔔 ${c ? c.name : 'Customer'} Reminder`;
                        const body =
                            `${r.reason || 'Reminder'}\n⏰ ${fmtTime(r.time)}${r.remindBefore !== '0' ? ` (notified ${r.remindBefore} min before)` : ''}`;
                        if (s.showNotification && window.Notification && Notification.permission === 'granted') {
                            try { new Notification(title, { body, icon: '🔔' }); } catch (e) {}
                        }
                        if (s.vibration && navigator.vibrate) navigator.vibrate([200, 100, 200]);
                        if (s.showPopup) toast(`🔔 ${title} — ${body}`);
                        if (now > dt) {
                            r.status = 'overdue';
                            pushHistory(r, 'Missed (overdue)');
                        }
                    }
                });
                if (changed) saveDB();
            }

                DB.reminders.forEach(r => {
                    if (r.status === 'completed' || r.status === 'snoozed') return;
                    const dt = combineDT(r.date, r.time);
                    if (!dt) return;
                    if (now > dt && !r._notified) {

                        r._notified = true;

                    try {
                        const ctx = new(window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'sine';
                        osc.frequency.value = 600;
                        gain.gain.value = 0.3;
                        osc.start();
                        osc.stop(ctx.currentTime + 0.4);
                    } catch (e) {}
                    toast('🔔 Test reminder fired!');
                }
            }

            </div>`;
            }

            // ---- Views ----
            function viewDashboard() {
                const rems = DB.reminders.map(r => ({ ...r, _status: reminderStatus(r) }));
                const missed = rems.filter(r => r._status === 'overdue' && !r._completed && !r._dismissed);
                const counts = {
                    overdue: rems.filter(r => r._status === 'overdue').length,
                    today: rems.filter(r => r._status === 'today').length,
                    upcoming: rems.filter(r => r._status === 'upcoming').length,
                    completed: rems.filter(r => r._status === 'completed').length,
                    followups: DB.followups.filter(f => !f.completed).length
                };
                const next = rems.filter(r => r._status === 'today' || r._status === 'overdue')
                    .sort((a, b) => combineDT(a.date, a.time) - combineDT(b.date, b.time))[0];

                const perm = (window.Notification && Notification.permission === 'granted') ? 'granted' : 'other';

                let draftHtml = '';
                if (localStorage.getItem(DRAFT_KEY)) {
                    draftHtml =
                        `<div class="draft-banner"><span class="db-text">📝 <strong>Unfinished draft</strong> — you have a customer record in progress</span><button class="btn primary sm" data-act="resumeDraft">Resume</button></div>`;

                const modeLabel = IS_NATIVE ?
                    `<span class="native-badge">📱 Native Android</span>` :
                    `<span class="browser-badge">🌐 Browser Mode</span>`;

                let html = `
              ${draftHtml}
              <div class="h-title">H4 Note Pad ${modeLabel}</div>
              <div class="h-sub">Customer Management · Notes · Reminders</div>

              <div class="mode-indicator">
                <span class="mode-dot ${IS_NATIVE ? 'native' : 'browser'}"></span>
                ${IS_NATIVE ? '✅ Running in native Android mode — reliable alarms, boot recovery, Room database' : '⚠️ Running in browser mode — reminders work only while the tab is open'}
              </div>

              <div class="reminder-status-widget">
                <div class="rsw-l">🔔 Reminder System</div>
                <div class="rsw-status" style="background:${IS_NATIVE ? 'rgba(34,197,94,.18)' : (perm === 'granted' ? 'rgba(34,197,94,.18)' : 'rgba(249,115,22,.18)')}; color:${IS_NATIVE ? '#22C55E' : (perm === 'granted' ? '#22C55E' : '#F97316')}">
                  ${IS_NATIVE ? '🟢 Native AlarmManager' : (perm === 'granted' ? '🟢 Active' : '🟠 Permission Required')}
                </div>
              </div>

              ${missed.length && !bannerDismissed ? `
              <div class="missed-banner">
                <div class="mb-head">🔴 ${missed.length} MISSED REMINDER${missed.length>1?'S':''}
                  <button class="btn ghost sm" style="margin-left:auto;" data-act="dismissBanner">Dismiss</button>
                </div>
                ${missed.slice(0,5).map(r => {
                  const c = DB.customers.find(c => c.id === r.customerId);
                  return `<div class="missed-item">
                    <div class="mi-top"><span>${escapeHtml(c ? c.name : 'Unknown')}${c ? ` — ${categoryLabel(DB.customerCategories,c.category)}` : ''}</span><span>${fmtTime(r.time)}</span></div>
                    <div class="mi-sub">${escapeHtml(r.reason || 'Reminder')}</div>
                    <div class="rem-actions">
                      <button data-act="callCustomer" data-id="${c ? c.id : ''}">📞 Call</button>
                      <button data-act="completeReminder" data-id="${r.id}">✅ Complete</button>
                      <button data-act="openSnooze" data-id="${r.id}">⏰ Snooze</button>
                      <button data-act="dismissMissed" data-id="${r.id}">✕ Dismiss</button>
                    </div>
                  </div>`;
                }).join('')}
              </div>` : ''}

              ${next ? `
              <div class="next-action-card">
                <div class="na-tag">🎯 NEXT ACTION</div>
                <div class="na-title">${methodIcon(next.method)} ${escapeHtml((DB.customers.find(c=>c.id===next.customerId)||{}).name||'Customer')}</div>
                <div class="na-meta">📅 ${fmtDate(next.date)} · ⏰ ${fmtTime(next.time)} — ${escapeHtml(next.reason||'')}</div>
                <div class="btn-row">
                  <button class="btn primary" data-act="callCustomer" data-id="${next.customerId}">📞 Call Now</button>
                  <button class="btn ghost" data-act="completeReminder" data-id="${next.id}">✅ Done</button>
                </div>
              </div>` : ''}

              <div class="stat-grid">
                <div class="stat-card stat-overdue"><div class="num">${counts.overdue}</div><div class="lbl">Overdue</div></div>
                <div class="stat-card stat-today"><div class="num">${counts.today}</div><div class="lbl">Today</div></div>
                <div class="stat-card stat-upcoming"><div class="num">${counts.upcoming}</div><div class="lbl">Upcoming</div></div>
                <div class="stat-card stat-completed"><div class="num">${counts.completed}</div><div class="lbl">Completed</div></div>
              </div>
              <div class="stat-grid" style="margin-top:-6px;">
                <div class="stat-card stat-followups"><div class="num">${counts.followups}</div><div class="lbl">Follow-ups</div></div>
              </div>

              <div class="section-head"><h2>Recent Customers</h2><a data-act="nav" data-route="customers">See all →</a></div>
              ${DB.customers.length === 0 ? emptyState('👤','No customers yet','Tap + to add your first customer.') : DB.customers.slice().reverse().slice(0,5).map(customerRow).join('')}
              `;
                return html;
            }

            function viewCustomerList() {
                const q = customerSearch.trim().toLowerCase();
                let list = DB.customers.filter(c => {
                    if (!q) return true;
                    const searchable = [c.name, c.mobile, c.whatsapp, c.altMobile, c.address, c.location,
                        c.note || '', (c.items || []).join(' '),
                        (c.contacts || []).join(' '), c.reason || ''
                    ].join(' ').toLowerCase();
                    return searchable.includes(q);
                });
                if (filterStatus === 'active') list = list.filter(c => c.archived !== true);
                else if (filterStatus === 'archived') list = list.filter(c => c.archived === true);
                if (filterCategory !== 'all') list = list.filter(c => c.category === filterCategory);
                if (filterPriority !== 'all') list = list.filter(c => c.priority === filterPriority);

                const cats = DB.customerCategories;

                return `
              ${topbar('Customers')}
              <div class="search-box">
                <input type="text" placeholder="🔍 Search name, mobile, item, note, category..." value="${escapeHtml(customerSearch)}" data-act="searchCustomers" id="customerSearchInput">
                <div class="filter-row">
                  <span class="filter-chip ${filterStatus === 'all' ? 'active' : ''}" data-act="filterCustomers" data-val="all">All</span>
                  <span class="filter-chip ${filterStatus === 'active' ? 'active' : ''}" data-act="filterCustomers" data-val="active">🟢 Active</span>
                  <span class="filter-chip ${filterStatus === 'archived' ? 'active' : ''}" data-act="filterCustomers" data-val="archived">⚪ Archived</span>
                  <span class="filter-chip ${filterCategory === 'all' ? 'active' : ''}" data-act="filterCategory" data-val="all">All Cats</span>
                  ${cats.slice(0,4).map(c => `<span class="filter-chip ${filterCategory === c.id ? 'active' : ''}" data-act="filterCategory" data-val="${c.id}">${c.icon} ${c.label}</span>`).join('')}
                  ${cats.length > 4 ? `<span class="filter-chip" data-act="filterCategory" data-val="more">+${cats.length-4}</span>` : ''}
                  <span class="filter-chip clear" data-act="clearFilters">✕ Clear</span>
                </div>
              </div>
              ${list.length === 0 ? emptyState('👥','No customers found','Try adjusting your search or filters.') : list.slice().reverse().map(customerRow).join('')}
              `;
            }

            function viewCustomerProfile(id) {
                const c = DB.customers.find(x => x.id === id);
                if (!c) return `${topbar('Not found','customers')}${emptyState('❓','Customer not found','')}`;

                const contacts = DB.contacts.filter(x => x.customerId === id);
                const notes = DB.notes.filter(x => x.customerId === id);
                const followups = DB.followups.filter(x => x.customerId === id);
                const reminders = DB.reminders.filter(x => x.customerId === id).map(r => ({ ...r, _status: reminderStatus(
                    r) }));

                const lastContact = contacts.slice().sort((a, b) => new Date(b.eventDate || b.createdAt) - new Date(a
                    .eventDate || a.createdAt))[0];
                const nextRem = reminders.filter(r => r._status !== 'completed').sort((a, b) => combineDT(a.date, a
                    .time) - combineDT(b.date, b.time))[0];

                const items = (c.items || []).map(iid => DB.items.find(i => i.id === iid)).filter(Boolean);

                let timelineEntries = [
                    ...contacts.map(x => ({ type: 'contact', accent: 'contact', ts: x.eventDate || x.createdAt,
                        icon: methodIcon(x.method),
                        title: `${categoryLabel(CONTACT_CATEGORIES,x.category)} · ${categoryLabel(CONTACT_METHODS,x.method)}`,
                        body: x.details })),
                    ...notes.map(x => ({ type: 'note', accent: 'notes', ts: x.createdAt, icon: '📝',
                        title: x.title || 'Note', body: x.body, images: x.images })),
                    ...followups.map(x => ({ type: 'followup', accent: 'followup', ts: x.createdAt, icon: '🔄',
                        title: 'Follow-up · ' + x.priority, body: x.reason })),
                    ...reminders.map(x => ({ type: 'reminder', accent: 'reminder', ts: x.createdAt, icon: '🔔',
                        title: `Reminder — ${STATUS_META[x._status].label}`,
                        body: `${fmtDate(x.date)} ${fmtTime(x.time)} · ${x.reason||''}` }))
                ];

                if (historyFilter !== 'all') {
                    timelineEntries = timelineEntries.filter(e => e.type === historyFilter);
                }
                timelineEntries.sort((a, b) => new Date(b.ts) - new Date(a.ts));

                const hue = ['#3B82F6', '#8B5CF6', '#06B6D4', '#F59E0B', '#F97316'][Math.abs(hashStr(c.id)) % 5];

                return `
              ${topbar('Customer', 'customers', `<button class="top-action" data-act="toggleArchive" data-id="${c.id}" title="${c.archived ? 'Unarchive' : 'Archive'}">${c.archived ? '📂' : '📁'}</button>`)}
              <div class="profile-hero" style="background:linear-gradient(135deg, ${hue}, #0B0F14 130%);">
                <div class="ph-avatar">${c.photo ? `<img src="${c.photo}">` : initials(c.name)}</div>
                <h1>${escapeHtml(c.name)}</h1>
                <div class="ph-cat">${categoryIcon(DB.customerCategories,c.category)} ${categoryLabel(DB.customerCategories,c.category)} · ${escapeHtml(c.mobile||'')}</div>
                <span class="ph-status" style="background:${c.archived ? 'rgba(255,255,255,0.05)' : 'rgba(34,197,94,0.2)'}; color:${c.archived ? 'var(--text3)' : '#22C55E'}">${c.archived ? '⚪ Archived' : '🟢 Active'}</span>
              </div>

              <div class="quick-actions">
                <button class="qa-btn" data-act="callCustomer" data-id="${c.id}"><span class="ic">📞</span>Call</button>
                <button class="qa-btn" data-act="waCustomer" data-id="${c.id}"><span class="ic">💬</span>WhatsApp</button>
                <button class="qa-btn" data-act="openAddNote" data-id="${c.id}"><span class="ic">📝</span>Note</button>
                <button class="qa-btn" data-act="openAddContact" data-id="${c.id}"><span class="ic">➕</span>Contact</button>
                <button class="qa-btn" data-act="openAddReminder" data-id="${c.id}"><span class="ic">🔔</span>Remind</button>
              </div>

              ${nextRem ? `
              <div class="next-action-card" style="border-left-color:var(--${nextRem._status === 'overdue' ? 'reminder' : 'followup'});">
                <div class="na-tag">${nextRem._status === 'overdue' ? '🔴 OVERDUE' : '🎯 NEXT ACTION'}</div>
                <div class="na-title">Call ${escapeHtml(c.name)}</div>
                <div class="na-meta">📅 ${fmtDate(nextRem.date)} · ⏰ ${fmtTime(nextRem.time)} — ${escapeHtml(nextRem.reason||'')}</div>
              </div>` : ''}

              ${lastContact ? `
              <div class="card" style="margin-bottom:16px;">
                <div style="font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;margin-bottom:8px;">Last Contact</div>
                <div style="font-weight:700;font-size:13px;">${methodIcon(lastContact.method)} ${categoryLabel(CONTACT_METHODS,lastContact.method)} · ${fmtDate(lastContact.eventDate || lastContact.date)}</div>
                <div style="font-size:12.5px;color:var(--text2);margin-top:4px;">${escapeHtml(lastContact.details||'')}</div>
              </div>` : ''}

              ${items.length ? `<div class="section-head"><h2>Items / Requirements</h2></div>
              <div class="chip-row" style="margin-bottom:6px;">${items.map(i => `<span class="chip selected" style="--acc:var(--item)">${i.icon||'🧪'} ${escapeHtml(i.name)}</span>`).join('')}</div>` : ''}

              <div class="card" style="margin:18px 0;">
                <div style="font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;margin-bottom:8px;">Contact Details</div>
                <div class="small-muted">
                  📱 ${escapeHtml(c.mobile||'—')}<br>
                  ${c.whatsapp ? `💬 ${escapeHtml(c.whatsapp)}<br>` : ''}
                  ${c.address ? `📍 ${escapeHtml(c.address)}<br>` : ''}
                  ${c.location ? `🗺️ ${escapeHtml(c.location)}` : ''}
                </div>
              </div>

              <div class="section-head"><h2>History</h2></div>
              <div class="tl-filter">
                <span class="tf-btn ${historyFilter === 'all' ? 'active' : ''}" data-act="histFilter" data-val="all">All</span>
                <span class="tf-btn ${historyFilter === 'contact' ? 'active' : ''}" data-act="histFilter" data-val="contact">📞</span>
                <span class="tf-btn ${historyFilter === 'note' ? 'active' : ''}" data-act="histFilter" data-val="note">📝</span>
                <span class="tf-btn ${historyFilter === 'followup' ? 'active' : ''}" data-act="histFilter" data-val="followup">🔄</span>
                <span class="tf-btn ${historyFilter === 'reminder' ? 'active' : ''}" data-act="histFilter" data-val="reminder">🔔</span>
              </div>
              ${timelineEntries.length === 0 ? emptyState('🕘','No history yet','Add a note, contact, or reminder above.') : `
              <div class="timeline">
                ${timelineEntries.map(e => `
                  <div class="tl-item" style="--acc:var(--${e.accent})">
                    <div class="tl-time">${new Date(e.ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'})}</div>
                    <div class="tl-card">
                      <div class="tl-title">${e.icon} ${escapeHtml(e.title)}</div>
                      ${e.body ? `<div class="tl-body">${nl2br(e.body)}</div>` : ''}
                      ${e.images && e.images.length ? `<div class="tl-imgs">${e.images.map(im => `<img src="${im}">`).join('')}</div>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>`}
              `;
            }

            function viewReminders() {
                const rems = DB.reminders.map(r => ({ ...r, _status: reminderStatus(r) }));
                const groups = [
                    ['overdue', '🔴 Overdue'],
                    ['today', '🟠 Today'],
                    ['missed', '🔴 Missed'],
                    ['snoozed', '🟡 Snoozed'],
                    ['upcoming', '🔵 Upcoming'],
                    ['completed', '🟢 Completed']
                ];
                let html = topbar('Reminders', null,
                    `<button class="top-action" data-act="testReminder" title="Test Reminder">🔔</button>`);
                let any = false;
                groups.forEach(([key, label]) => {
                    const list = rems.filter(r => r._status === key).sort((a, b) => combineDT(a.date, a.time) -
                        combineDT(b.date, b.time));
                    if (!list.length) return;
                    any = true;
                    html += `<div class="rem-group-title">${label} — ${list.length}</div>`;
                    html += list.map(r => reminderCard(r)).join('');
                });
                if (!any) html += emptyState('🔔', 'No reminders yet',
                    'Reminders you create from a customer will show up here.');
                return html;
            }

            function reminderCard(r) {
                const c = DB.customers.find(x => x.id === r.customerId);
                const meta = STATUS_META[r._status] || STATUS_META.upcoming;
                const done = r._status === 'completed';
                const isMissed = r._status === 'missed' || r._status === 'overdue';
                return `<div class="rem-card" style="border-left-color:${meta.color}">
              <div class="rc-top">
                <div>
                  <div class="rc-name">${escapeHtml(c ? c.name : 'Unknown')} ${c ? `— ${categoryLabel(DB.customerCategories,c.category)}` : ''}</div>
                  <div class="rc-reason">${methodIcon(r.method)} ${escapeHtml(r.reason || 'Reminder')}</div>
                </div>
                <span class="badge" style="background:${meta.color}22; color:${meta.color}">${meta.dot} ${meta.label}</span>
              </div>
              <div class="rc-time">📅 ${fmtDate(r.date)} · ⏰ ${fmtTime(r.time)} ${r.priority ? ('· ' + r.priority) : ''}</div>
              ${r.repeat && r.repeat !== 'none' ? `<div class="rc-meta">🔄 ${r.repeat}</div>` : ''}

              <div class="field">

                  ${SNOOZE_OPTS.filter(o => o[0] !== 'custom').map(o => `<option value="${o[0]}" ${s.defaultSnooze === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
                </select>
              </div>

              <div class="section-head"><h2>Notification</h2></div>
              ${toggleRow('showPopup','Show Popup','In-app popup when a reminder is due', s.showPopup)}
              ${toggleRow('showNotification','Show Notification','Browser/OS notification while the app is open', s.showNotification)}
              ${toggleRow('lockScreen','Lock Screen Notification','Show reminder details on the lock screen', s.lockScreen)}

              <div class="section-head"><h2>Missed Reminders</h2></div>
              ${toggleRow('showMissedOnOpen','Show Missed on App Open','Recheck for missed reminders every time you open the app', s.showMissedOnOpen)}

              ${toggleRow('showOverdueCount','Show Overdue Count on Home','', s.showOverdueCount)}

              <div class="section-head"><h2>🔧 Reminder Health</h2></div>
              <div class="card" style="margin-bottom:14px;">
                ${diagnosticItem('Mode', IS_NATIVE ? '🟢 Native Android' : '🟠 Browser', IS_NATIVE)}

                ${diagnosticItem('Vibration', s.vibration ? '🟢 Enabled' : '⚪ Disabled', s.vibration)}
                ${diagnosticItem('Sound', s.sound || 'Default', true)}
                ${diagnosticItem('Total Reminders', DB.reminders.length, true)}
                ${diagnosticItem('Overdue', DB.reminders.filter(r => reminderStatus(r) === 'overdue').length, true)}
                ${IS_NATIVE ? diagnosticItem('AlarmManager', '🟢 Active', true) : diagnosticItem('AlarmManager', '⚪ Not available', false)}
                ${IS_NATIVE ? diagnosticItem('Boot Receiver', '🟢 Registered', true) : diagnosticItem('Boot Receiver', '⚪ Not available', false)}

              <div class="small-muted mt-12">Tests sound, vibration, and notification together.</div>

              <div class="section-head" style="margin-top:24px;"><h2>📋 Customer Categories</h2></div>
              <div class="cat-grid" style="margin-bottom:12px;">
                ${cats.map(c => `<div class="cat-card" style="--acc:var(--customer);border-color:${c.disabled ? 'var(--line)' : 'var(--customer)'};opacity:${c.disabled ? 0.4 : 1};">
                  <span class="cat-ic">${c.icon}</span><span class="cat-lbl">${c.label}</span>
                  <div style="display:flex;gap:4px;margin-top:4px;">
                    <button class="btn ghost sm" data-act="editCategory" data-id="${c.id}">✏️</button>
                    <button class="btn ghost sm" data-act="toggleCategory" data-id="${c.id}">${c.disabled ? '🔓' : '🔒'}</button>
                    <button class="btn danger sm" data-act="deleteCategory" data-id="${c.id}">🗑️</button>
                  </div>
                </div>`).join('')}
                <div class="cat-card add-new" style="border-style:dashed;cursor:pointer;" data-act="addCategory">
                  <span class="cat-ic">➕</span><span class="cat-lbl">Add Category</span>
                </div>
              </div>

              <div class="section-head"><h2>📦 Item Catalog</h2></div>
              <div class="item-grid" style="margin-bottom:12px;">
                ${DB.items.map(i => `<div class="item-card" style="${i.active === false ? 'opacity:0.4;' : ''}">
                  <div class="ic-thumb">${i.image ? `<img src="${i.image}">` : (i.icon || '🧪')}</div>
                  <div class="ic-name">${escapeHtml(i.name)}</div>
                  <div style="display:flex;gap:4px;margin-top:4px;">
                    <button class="btn ghost sm" data-act="editItem" data-id="${i.id}">✏️</button>
                    <button class="btn ghost sm" data-act="toggleItemActive" data-id="${i.id}">${i.active !== false ? '🔒' : '🔓'}</button>
                    <button class="btn danger sm" data-act="deleteItem" data-id="${i.id}">🗑️</button>
                  </div>
                </div>`).join('')}
                <div class="item-card add-new" style="border-style:dashed;cursor:pointer;" data-act="addItem">
                  <div class="ic-thumb">➕</div>
                  <div class="ic-name">Add Item</div>
                </div>
              </div>

              <div class="section-head"><h2>💾 Data Management</h2></div>
              <div class="card" style="margin-bottom:14px;">
                <div class="btn-row">
                  <button class="btn primary" data-act="exportBackup">📤 Export Backup</button>
                  <button class="btn ghost" data-act="importBackup">📥 Import Backup</button>
                </div>
                <div class="btn-row mt-12">
                  <button class="btn danger" data-act="deleteAllData">🗑️ Delete All Data</button>
                </div>
                <div class="small-muted mt-12">${IS_NATIVE ? 'Data is stored in Room SQLite database.' : 'Data is stored in localStorage.'}</div>
              </div>

              <div class="section-head"><h2>📱 Native Android Architecture</h2></div>
              <div class="card" style="border-left:3px solid var(--history);">
                <div style="font-weight:700;margin-bottom:6px;">✅ This app is ${IS_NATIVE ? 'running in native Android mode' : 'ready for native Android deployment'}</div>
                <p class="small-muted">
                  ${IS_NATIVE ? '🟢 All reminders are scheduled via Android AlarmManager with:\n• Boot recovery (BOOT_COMPLETED)\n• Exact alarm permission\n• Battery optimization handling\n• Native notifications with action buttons\n• Custom ringtone support\n• Room SQLite database' : '⚡ To enable reliable reminders, deploy this app as a native Android WebView with:\n• AlarmManager for exact scheduling\n• BOOT_COMPLETED broadcast receiver\n• Room/SQLite for data persistence\n• Native notification actions (Call, Complete, Snooze)\n• Missed-reminder detection on boot'}
                </p>
                <div style="font-size:11px;color:var(--text3);margin-top:6px;">
                  🔹 <strong>Database:</strong> ${IS_NATIVE ? 'Room SQLite' : 'localStorage (browser)'} ·
                  🔹 <strong>Reminders:</strong> ${IS_NATIVE ? 'AlarmManager' : 'setInterval (30s)'} ·
                  🔹 <strong>Notifications:</strong> ${IS_NATIVE ? 'Native Android' : 'Web Notification API'} ·
                  🔹 <strong>Boot recovery:</strong> ${IS_NATIVE ? '✅' : '❌'}
                </div>
              </div>
              `;
                return html;
            }

            function toggleRow(key, label, sub, checked) {
                return `<div class="switch-row">
              <div><div class="sr-label">${label}</div>${sub ? `<div class="sr-sub">${sub}</div>` : ''}</div>
              <label class="switch"><input type="checkbox" data-bind-settings-toggle="${key}" ${checked ? 'checked' : ''}><span class="track"></span><span class="knob"></span></label>
            </div>`;
            }

            function diagnosticItem(label, status, ok) {
                return `<div class="diag-item"><span class="diag-label">${label}</span><span class="diag-status ${ok ? 'ok' : 'fail'}">${status}</span></div>`;
            }

            // ---- Wizard views ----
            function viewWizard() {
                const step = STEPS[wStep - 1];
                const pct = Math.round((wStep / STEPS.length) * 100);
                return `
              <div class="wiz-top">
                <div class="wiz-top-row">
                  <button class="wiz-close" data-act="closeWizard">✕</button>
                  <span class="wiz-step-lbl">Step ${wStep} of ${STEPS.length}</span>
                </div>
                <div class="wiz-progress"><div class="wiz-progress-fill" style="width:${pct}%; background:var(--${step.accent}-grad)"></div></div>
              </div>
              <div class="wiz-head">
                <div class="wi" style="background:var(--${step.accent}-grad)">${step.icon}</div>
                <div><h2>${step.title}</h2><p>${step.label}</p></div>
              </div>
              <div id="wizBody">${wizardStepBody(step.key)}</div>
              <div class="wiz-nav">
                ${wStep > 1 ? `<button class="btn ghost" data-act="wizPrev">← Previous</button>` : `<button class="btn ghost" disabled>← Previous</button>`}
                ${wStep < STEPS.length ? `<button class="btn primary" data-act="wizNext">Next →</button>` : `<button class="btn primary" data-act="wizSave">✅ Save Customer Record</button>`}
              </div>
              `;
            }

            function wizardStepBody(key) {
                switch (key) {
                    case 'customer':
                        return stepCustomer();
                    case 'item':
                        return stepItem();
                    case 'contact':
                        return stepContact();
                    case 'note':
                        return stepNote();
                    case 'followup':
                        return stepFollowup();
                    case 'reminder':
                        return stepReminder();
                    case 'review':
                        return stepReview();
                }
            }

            function stepCustomer() {
                const d = draft.customer;
                const cats = DB.customerCategories;
                return `
              <div class="field"><label>Customer Name <span class="req">*</span></label>
                <input type="text" data-bind="customer.name" value="${escapeHtml(d.name)}" placeholder="e.g. Abdul Rahman">
              </div>
              <div class="field"><label>Customer Category <span class="req">*</span></label>
                ${categoryCards(cats, d.category, 'selectCustomerCategory', 'customer')}
              </div>
              <div class="field"><label>Mobile Number <span class="req">*</span></label>
                <input type="tel" maxlength="10" data-bind="customer.mobile" value="${escapeHtml(d.mobile)}" placeholder="10-digit mobile number">
                <div class="hint">Indian mobile numbers only (starts 6–9, 10 digits).</div>
              </div>
              <div class="field"><label>WhatsApp Number</label>
                <input type="tel" data-bind="customer.whatsapp" value="${escapeHtml(d.whatsapp)}" placeholder="If different from mobile">
              </div>
              <div class="field"><label>Alternative Number</label>
                <input type="tel" data-bind="customer.altMobile" value="${escapeHtml(d.altMobile)}">
              </div>
              <div class="field"><label>Address</label>
                <textarea data-bind="customer.address" placeholder="House/Street/Area/City">${escapeHtml(d.address)}</textarea>
              </div>
              <div class="field"><label>Location</label>
                <input type="text" data-bind="customer.location" value="${escapeHtml(d.location)}" placeholder="Landmark or area">
              </div>
              <div class="field"><label>Photo</label>
                <div class="thumb-row">
                  ${d.photo ? `<div class="thumb"><img src="${d.photo}"><button class="rm" data-act="removeCustomerPhoto">✕</button></div>` : ''}
                  <label class="add-thumb" style="display:flex;align-items:center;justify-content:center;cursor:pointer;">📷<input type="file" accept="image/*" id="customerPhotoInput" style="display:none;"></label>
                </div>
              </div>
              `;
            }

            function stepItem() {
                const sel = draft.items.selected;
                let html = `<div class="item-grid">`;
                DB.items.filter(i => i.active !== false).forEach(i => {
                    const isSel = sel.includes(i.id);
                    html += `<div class="item-card ${isSel ? 'selected' : ''}" data-act="toggleItem" data-val="${i.id}">
                ${isSel ? '<span class="ic-check">✓</span>' : ''}
                <div class="ic-thumb">${i.image ? `<img src="${i.image}">` : (i.icon || '🧪')}</div>
                <div class="ic-name">${escapeHtml(i.name)}</div>
              </div>`;
                });
                html +=
                    `<div class="item-card add-new" data-act="toggleAddItem"><div class="ic-thumb">➕</div><div class="ic-name">Add New</div></div>`;
                html += `</div>`;
                if (addingNewItem) {
                    html += `<div class="inline-form">
                <div class="field"><label>Item Name</label><input type="text" id="newItemName" placeholder="e.g. PU Coating"></div>
                <div class="field"><label>Icon (emoji, optional)</label><input type="text" id="newItemIcon" maxlength="4" placeholder="🧴"></div>
                <div class="field"><label>PNG / JPG / WebP Image (optional)</label><input type="file" id="newItemImage" accept="image/*"></div>
                <div class="field"><label>Description</label><textarea id="newItemDesc" placeholder="Short description"></textarea></div>
                <div class="btn-row">
                  <button class="btn ghost" data-act="toggleAddItem">Cancel</button>
                  <button class="btn primary" data-act="saveNewItem">Save Item</button>
                </div>
              </div>`;
                }
                html += `<p class="small-muted" style="margin-top:12px;">You can select more than one item.</p>`;
                return html;
            }

            function stepContact() {
                const d = draft.contact;
                return `
              <div class="field"><label>Contact Category</label>${categoryCards(CONTACT_CATEGORIES, d.category, 'selectContactCategory','contact')}</div>
              <div class="field"><label>Contact Method</label>${categoryCards(CONTACT_METHODS, d.method, 'selectContactMethod','contact')}</div>
              <div class="field-row" style="display:flex; gap:10px;">
                <div class="field" style="flex:1;"><label>Date</label><input type="date" data-bind="contact.date" value="${d.date}"></div>
                <div class="field" style="flex:1;"><label>Time</label><input type="time" data-bind="contact.time" value="${d.time}"></div>
              </div>
              <div class="field"><label>Contact Details / Conversation</label>
                <textarea class="lg" data-bind="contact.details" placeholder="Customer-ുമായി എന്താണ് സംസാരിച്ചത് എന്ന് ഇവിടെ എഴുതുക...">${escapeHtml(d.details)}</textarea>
              </div>
              `;
            }

            function stepNote() {
                const d = draft.note;
                return `
              <div class="field"><label>Note Title (optional)</label>
                <input type="text" data-bind="note.title" value="${escapeHtml(d.title)}" placeholder="e.g. Bathroom Waterproofing Enquiry">
              </div>
              <div class="field"><label>Main Note</label>
                <textarea class="xl" data-bind="note.body" placeholder="Write everything the customer said in detail...">${escapeHtml(d.body)}</textarea>
              </div>
              <div class="field"><label>Note Category</label>
                <div class="chip-row">${NOTE_CATEGORIES.map(c => `<button type="button" class="chip ${d.category === c ? 'selected' : ''}" style="--acc:var(--notes)" data-act="selectNoteCategory" data-val="${c}">${c}</button>`).join('')}</div>
              </div>
              <div class="field"><label>Attach Images</label>
                <div class="thumb-row">
                  ${d.images.map((im, idx) => `<div class="thumb"><img src="${im}"><button class="rm" data-act="removeNoteImage" data-idx="${idx}">✕</button></div>`).join('')}
                  <label class="add-thumb" style="display:flex;align-items:center;justify-content:center;cursor:pointer;">📷<input type="file" accept="image/*" multiple id="noteImageInput" style="display:none;"></label>
                </div>
                <div class="hint">Photos are auto-compressed before saving.</div>
              </div>
              `;
            }

            function stepFollowup() {
                const d = draft.followup;
                return `
              ${switchField('followup.required','Follow-up Required', d.required)}
              ${d.required ? `
              <div class="field-row" style="display:flex; gap:10px;">
                <div class="field" style="flex:1;"><label>Follow-up Date</label><input type="date" data-bind="followup.date" value="${d.date}"></div>
                <div class="field" style="flex:1;"><label>Follow-up Time</label><input type="time" data-bind="followup.time" value="${d.time}"></div>
              </div>
              <div class="field"><label>Follow-up Reason</label>
                <textarea data-bind="followup.reason" placeholder="e.g. Call customer to ask about sample result.">${escapeHtml(d.reason)}</textarea>
              </div>
              <div class="field"><label>Preferred Contact Method</label>${categoryCards(CONTACT_METHODS.slice(0,4), d.method, 'selectFollowupMethod','followup')}</div>
              <div class="field"><label>Priority</label>
                <div class="chip-row">${PRIORITIES.map(p => `<button type="button" class="chip ${d.priority === p ? 'selected' : ''}" style="--acc:var(--followup)" data-act="selectFollowupPriority" data-val="${p}">${p}</button>`).join('')}</div>
              </div>
              ${switchField('followup.createNext','Create Next Follow-up after completion', d.createNext)}
              ` : `<p class="small-muted">Turn this on if you need to reach out to the customer again.</p>`}
              `;
            }

            function stepReminder() {
                const d = draft.reminder;
                return `
              ${switchField('reminder.create','Create Reminder', d.create)}
              ${d.create ? `
              <div class="field-row" style="display:flex; gap:10px;">
                <div class="field" style="flex:1;"><label>Reminder Date</label><input type="date" data-bind="reminder.date" value="${d.date}"></div>
                <div class="field" style="flex:1;"><label>Reminder Time</label><input type="time" data-bind="reminder.time" value="${d.time}"></div>
              </div>
              <div class="field"><label>Reminder Reason</label>
                <textarea class="lg" data-bind="reminder.reason" placeholder="e.g. Customer used the waterproofing sample. Ask for the result.">${escapeHtml(d.reason)}</textarea>
              </div>
              <div class="field"><label>Contact Method</label>${categoryCards(CONTACT_METHODS.slice(0,4), d.method, 'selectReminderMethod','reminder')}</div>
              <div class="field"><label>Priority</label>
                <div class="chip-row">${PRIORITIES.map(p => `<button type="button" class="chip ${d.priority === p ? 'selected' : ''}" style="--acc:var(--reminder)" data-act="selectReminderPriority" data-val="${p}">${p}</button>`).join('')}</div>
              </div>
              <div class="field"><label>Remind Me Before</label>
                <select data-bind="reminder.remindBefore">${REMIND_BEFORE.map(o => `<option value="${o[0]}" ${d.remindBefore === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>

              <div class="field"><label>Repeat</label>
                <select data-bind="reminder.repeat">${REPEAT_OPTS.map(o => `<option value="${o[0]}" ${d.repeat === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
              </div>
              <div class="field"><label>Sound</label>
                <div class="sound-picker">
                  ${SOUND_OPTS.map(o => `<span class="sound-opt ${d.sound === o ? 'selected' : ''}" data-act="selectReminderSound" data-val="${o}">${o}</span>`).join('')}
                </div>
              </div>
              ${IS_NATIVE ? `
              <div class="card" style="border-left:3px solid var(--history);">
                <div style="font-weight:700; margin-bottom:6px;">📱 Native AlarmManager</div>
                <p class="small-muted">This reminder will be scheduled with Android AlarmManager and will fire even if the phone is locked or rebooted.</p>
              </div>` : `
              ${!(window.Notification && Notification.permission === 'granted') ? `
              <div class="card" style="border-left:3px solid var(--reminder);">
                <div style="font-weight:700; margin-bottom:6px;">🔔 Reminder Permission Required</div>
                <p class="small-muted" style="margin-bottom:10px;">Allow notifications so this reminder can alert you while the app is open.</p>
                <button class="btn primary" data-act="requestNotifPermission">Enable Reminder</button>
              </div>` : ''}`}
              ` : `<p class="small-muted">Turn this on to set a local reminder linked to this customer and note.</p>`}
              `;
            }

            function stepReview() {
                const d = draft;
                const items = d.items.selected.map(id => DB.items.find(i => i.id === id)).filter(Boolean);
                return `
              <div class="card" style="margin-bottom:12px;">

                <div class="small-muted">${categoryLabel(DB.customerCategories,d.customer.category)} · ${escapeHtml(d.customer.mobile)}</div>
              </div>
              <div class="card" style="margin-bottom:12px;">
                <div style="font-size:11px;font-weight:800;color:var(--item);text-transform:uppercase;margin-bottom:6px;">Item</div>
                ${items.length ? items.map(i => `<span class="chip selected" style="--acc:var(--item)">${i.icon||'🧪'} ${escapeHtml(i.name)}</span>`).join(' ') : '<span class="small-muted">None selected</span>'}
              </div>
              <div class="card" style="margin-bottom:12px;">
                <div style="font-size:11px;font-weight:800;color:var(--contact);text-transform:uppercase;margin-bottom:6px;">Contact</div>
