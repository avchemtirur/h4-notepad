<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>H4 Note Pad</title>
<style>
:root{
  --bg:#0B0F14; --card:#121923; --input:#18212C; --line:#232C38;
  --text:#FFFFFF; --text2:#AAB4C0; --text3:#6B7686;

  --customer:#3B82F6; --customer-grad:linear-gradient(135deg,#3B82F6,#6366F1);
  --item:#8B5CF6;     --item-grad:linear-gradient(135deg,#8B5CF6,#A855F7);
  --contact:#06B6D4;  --contact-grad:linear-gradient(135deg,#06B6D4,#0EA5E9);
  --notes:#F59E0B;    --notes-grad:linear-gradient(135deg,#F59E0B,#F97316);
  --followup:#F97316; --followup-grad:linear-gradient(135deg,#F97316,#FB923C);
  --reminder:#EF4444; --reminder-grad:linear-gradient(135deg,#EF4444,#F43F5E);
  --history:#22C55E;  --history-grad:linear-gradient(135deg,#22C55E,#16A34A);

  --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{overscroll-behavior:none;}
button, input, select, textarea{font-family:inherit;}
#shell{max-width:1100px; margin:0 auto; min-height:100dvh; min-height:100vh; display:flex; flex-direction:column;}
#app{flex:1; padding:14px 14px 90px;}
a{color:inherit;}

/* ---------- generic ---------- */
.h-title{font-size:20px; font-weight:800; margin:2px 0 2px;}
.h-sub{font-size:13px; color:var(--text2); margin:0 0 16px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; color:var(--text2); margin-bottom:6px; font-weight:600;}
.field .req{color:var(--reminder);}
.field input[type=text], .field input[type=tel], .field input[type=date], .field input[type=time], .field select, .field textarea{
  width:100%; background:var(--input); border:1px solid var(--line); color:var(--text);
  border-radius:12px; padding:14px 14px; font-size:16px; min-height:52px;
}
.field textarea{min-height:90px; resize:vertical; line-height:1.4;}
.field textarea.lg{min-height:190px;}
.field textarea.xl{min-height:230px;}
.field .hint{font-size:11px; color:var(--text3); margin-top:5px;}
.field .err{font-size:12px; color:#FF6B6B; margin-top:5px; display:none;}
.field.invalid input, .field.invalid select{border-color:#FF6B6B;}
.field.invalid .err{display:block;}
@media(min-width:700px){
  .field textarea{min-height:120px;}
  .field textarea.lg{min-height:260px;}
  .field textarea.xl{min-height:320px;}
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:14px; padding:14px 20px; font-size:15px; font-weight:700;
  min-height:52px; background:var(--input); color:var(--text); width:100%;
}
.btn.primary{background:var(--customer-grad); color:#fff;}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text2);}
.btn.sm{min-height:40px; padding:8px 14px; font-size:13px; width:auto;}
.btn:disabled{opacity:.4;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px;}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

/* ---------- top bar (per view) ---------- */
.topbar{display:flex; align-items:center; gap:10px; padding:14px 0 10px; position:sticky; top:0; background:var(--bg); z-index:5;}
.topbar .back{background:var(--card); border:1px solid var(--line); color:var(--text); width:40px; height:40px; border-radius:12px; font-size:18px; flex-shrink:0;}
.topbar h1{font-size:18px; margin:0; font-weight:800; flex:1;}

/* ---------- bottom tab bar ---------- */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40; background:#0E1319; border-top:1px solid var(--line);
  display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  max-width:1100px; margin:0 auto;
}
#tabbar button{
  flex:1; background:none; border:none; color:var(--text3); display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:8px 2px; font-size:10px; font-weight:700; border-radius:12px;
}
#tabbar button .tic{font-size:19px;}
#tabbar button.active{color:var(--text);}
#tabbar button.fab{position:relative; top:-14px;}
#tabbar button.fab .tic{
  width:48px; height:48px; border-radius:50%; background:var(--customer-grad); display:flex; align-items:center; justify-content:center;
  font-size:22px; color:#fff; box-shadow:0 6px 18px rgba(59,130,246,.5);
}
body.wizard-mode #tabbar{display:none;}
body.wizard-mode #app{padding-bottom:16px;}

/* ---------- dashboard ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px;}
@media(min-width:600px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; border-top:3px solid transparent;}
.stat-card .num{font-size:24px; font-weight:800;}
.stat-card .lbl{font-size:11px; color:var(--text2); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.stat-overdue{border-top-color:var(--reminder);}
.stat-today{border-top-color:var(--followup);}
.stat-upcoming{border-top-color:var(--customer);}
.stat-completed{border-top-color:var(--history);}

.missed-banner{
  background:linear-gradient(135deg,#3a0d0d,#1c0808); border:1px solid #5a1616; border-radius:var(--r);
  padding:14px; margin-bottom:16px;
}
.missed-banner .mb-head{display:flex; align-items:center; gap:8px; font-weight:800; color:#FF8080; margin-bottom:8px;}
.missed-item{background:rgba(255,255,255,.04); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
.missed-item:last-child{margin-bottom:0;}
.missed-item .mi-top{display:flex; justify-content:space-between; font-size:13px; font-weight:700;}
.missed-item .mi-sub{font-size:12px; color:var(--text2); margin:3px 0 8px;}

.next-action-card{
  border-radius:var(--r); padding:16px; margin-bottom:16px; background:var(--card); border:1px solid var(--line);
  border-left:4px solid var(--reminder);
}
.next-action-card .na-tag{font-size:11px; font-weight:800; color:var(--reminder); letter-spacing:.06em; margin-bottom:6px;}
.next-action-card .na-title{font-size:16px; font-weight:800; margin-bottom:4px;}
.next-action-card .na-meta{font-size:12px; color:var(--text2); margin-bottom:12px;}

.section-head{display:flex; justify-content:space-between; align-items:center; margin:22px 0 10px;}
.section-head h2{font-size:14px; margin:0; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--text2);}
.section-head a{font-size:12px; color:var(--customer); font-weight:700;}

.reminder-status-widget{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:16px;}
.reminder-status-widget .rsw-l{font-size:13px; font-weight:700;}
.reminder-status-widget .rsw-status{font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px;}

/* ---------- lists ---------- */
.list-row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;}
.avatar{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; flex-shrink:0; font-size:16px;}
.list-row .lr-body{flex:1; min-width:0;}
.list-row .lr-title{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-row .lr-sub{font-size:12px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-row .lr-arrow{color:var(--text3); font-size:18px;}
.search-box{margin-bottom:14px;}
.search-box input{width:100%; background:var(--input); border:1px solid var(--line); color:var(--text); border-radius:14px; padding:13px 14px; font-size:15px;}
.empty-state{text-align:center; color:var(--text3); padding:50px 20px; font-size:13px;}
.empty-state .ic{font-size:34px; margin-bottom:10px;}

/* ---------- category / item cards ---------- */
.cat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
@media(min-width:600px){.cat-grid{grid-template-columns:repeat(3,1fr);}}
.cat-card{
  position:relative; background:var(--input); border:2px solid var(--line); border-radius:14px; padding:14px 10px;
  display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text); min-height:78px; justify-content:center;
}
.cat-card .cat-ic{font-size:22px;}
.cat-card .cat-lbl{font-size:12px; font-weight:700; text-align:center; line-height:1.25;}
.cat-card.selected{border-color:var(--acc,var(--customer)); background:color-mix(in srgb, var(--acc,var(--customer)) 14%, var(--input));}
.cat-card .cat-check{position:absolute; top:6px; right:8px; font-size:13px; color:var(--acc,var(--customer)); font-weight:900;}

.item-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media(min-width:600px){.item-grid{grid-template-columns:repeat(3,1fr);}}
.item-card{position:relative; background:var(--input); border:2px solid var(--line); border-radius:16px; padding:16px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; min-height:110px; justify-content:center;}
.item-card.selected{border-color:var(--item); background:color-mix(in srgb, var(--item) 14%, var(--input));}
.item-card .ic-thumb{width:52px; height:52px; border-radius:12px; background:#0000; display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden; background:rgba(255,255,255,.05);}
.item-card .ic-thumb img{width:100%; height:100%; object-fit:cover;}
.item-card .ic-name{font-size:12px; font-weight:700; text-align:center;}
.item-card .ic-check{position:absolute; top:8px; right:10px; color:var(--item); font-weight:900;}
.item-card.add-new{border-style:dashed; color:var(--text2);}

.inline-form{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px;}
.thumb-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
.thumb{position:relative; width:70px; height:70px; border-radius:12px; overflow:hidden; background:var(--input); border:1px solid var(--line);}
.thumb img{width:100%; height:100%; object-fit:cover;}
.thumb .rm{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:11px;}
.add-thumb{width:70px; height:70px; border-radius:12px; border:1.5px dashed var(--line); background:none; color:var(--text2); font-size:22px;}

/* ---------- toggle switch ---------- */
.switch-row{display:flex; align-items:center; justify-content:space-between; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:14px;}
.switch-row .sr-label{font-weight:700; font-size:14px;}
.switch-row .sr-sub{font-size:11px; color:var(--text2); margin-top:2px;}
.switch{position:relative; width:48px; height:28px; flex-shrink:0;}
.switch input{opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:20px; transition:.15s;}
.switch .knob{position:absolute; top:3px; left:3px; width:22px; height:22px; background:#fff; border-radius:50%; transition:.15s;}
.switch input:checked + .track{background:var(--history-grad);}
.switch input:checked ~ .knob{transform:translateX(20px);}

/* ---------- priority chips ---------- */
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{background:var(--input); border:1.5px solid var(--line); color:var(--text2); border-radius:20px; padding:9px 15px; font-size:12.5px; font-weight:700;}
.chip.selected{border-color:var(--acc,var(--reminder)); color:#fff; background:color-mix(in srgb, var(--acc,var(--reminder)) 25%, var(--input));}

/* ---------- wizard ---------- */
.wiz-top{padding:14px 0 6px;}
.wiz-top-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.wiz-close{background:var(--card); border:1px solid var(--line); color:var(--text); width:38px; height:38px; border-radius:12px; font-size:16px;}
.wiz-step-lbl{font-size:12px; color:var(--text2); font-weight:700;}
.wiz-progress{height:7px; background:var(--input); border-radius:6px; overflow:hidden; margin-bottom:16px;}
.wiz-progress-fill{height:100%; border-radius:6px; transition:width .25s;}
.wiz-head{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.wiz-head .wi{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:21px; color:#fff; flex-shrink:0;}
.wiz-head h2{margin:0; font-size:18px; font-weight:800;}
.wiz-head p{margin:2px 0 0; font-size:12px; color:var(--text2);}
.wiz-nav{display:flex; gap:10px; margin-top:22px;}
.wiz-nav .btn{flex:1;}

/* ---------- timeline ---------- */
.timeline{position:relative; padding-left:22px;}
.timeline::before{content:''; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:var(--line);}
.tl-item{position:relative; margin-bottom:16px;}
.tl-item::before{content:''; position:absolute; left:-22px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--acc,var(--customer)); border:2px solid var(--bg);}
.tl-item .tl-time{font-size:11px; color:var(--text3); font-weight:700; margin-bottom:3px;}
.tl-item .tl-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px;}
.tl-item .tl-title{font-size:13px; font-weight:700; margin-bottom:3px;}
.tl-item .tl-body{font-size:12.5px; color:var(--text2); white-space:pre-wrap; line-height:1.45;}
.tl-item .tl-imgs{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.tl-item .tl-imgs img{width:54px; height:54px; border-radius:8px; object-fit:cover;}

/* profile header */
.profile-hero{border-radius:var(--r); padding:20px 16px; margin-bottom:14px; position:relative; overflow:hidden;}
.profile-hero .ph-avatar{width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; margin-bottom:10px;}
.profile-hero h1{margin:0; font-size:20px; font-weight:800;}
.profile-hero .ph-cat{font-size:12.5px; opacity:.9; margin-top:2px;}
.quick-actions{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:14px 0 18px;}
.qa-btn{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text); font-size:9.5px; font-weight:700;}
.qa-btn .ic{font-size:18px;}

/* ---------- reminders board ---------- */
.rem-group-title{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; margin:18px 0 10px;}
.rem-card{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--reminder); border-radius:14px; padding:13px 14px; margin-bottom:10px;}
.rem-card .rc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.rem-card .rc-name{font-weight:800; font-size:14px;}
.rem-card .rc-reason{font-size:12.5px; color:var(--text2); margin:4px 0 10px;}
.rem-card .rc-time{font-size:11px; color:var(--text3); font-weight:700;}
.rem-actions{display:flex; gap:6px; flex-wrap:wrap;}
.rem-actions button{flex:1; min-width:70px; background:var(--input); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 6px; font-size:11px; font-weight:700;}

/* ---------- modal / sheet ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:60; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{background:var(--bg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head h3{margin:0; font-size:16px; font-weight:800;}
.modal-head .x{background:var(--card); border:1px solid var(--line); color:var(--text); width:34px; height:34px; border-radius:10px; font-size:15px;}
.snooze-opts{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.snooze-opts button{background:var(--input); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:14px 8px; font-weight:700; font-size:13px;}

.toast{position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#1a222c; border:1px solid var(--line); color:#fff; padding:10px 16px; border-radius:20px; font-size:12.5px; z-index:90; opacity:0; transition:opacity .25s; font-weight:600;}
.toast.show{opacity:1;}
.small-muted{font-size:11px; color:var(--text3); line-height:1.5;}
</style>
</head>
<body>
<div id="shell">
  <div id="app"></div>
  <nav id="tabbar">
    <button data-act="nav" data-route="dashboard"><span class="tic">🏠</span>Home</button>
    <button data-act="nav" data-route="customers"><span class="tic">👥</span>Customers</button>
    <button class="fab" data-act="startWizard"><span class="tic">➕</span></button>
    <button data-act="nav" data-route="reminders"><span class="tic">🔔</span>Reminders</button>
    <button data-act="nav" data-route="settings"><span class="tic">⚙️</span>Settings</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);

/* ============================================================
   DATA
============================================================ */
const LS_KEY = 'h4np_data_v1';
const DRAFT_KEY = 'h4np_draft_v1';

function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtTime(hhmm){ if(!hhmm) return ''; const [h,m]=hhmm.split(':').map(Number); const ap=h>=12?'PM':'AM'; const h12=((h+11)%12)+1; return h12+':'+String(m).padStart(2,'0')+' '+ap; }
function combineDT(dateIso, hhmm){ if(!dateIso||!hhmm) return null; return new Date(dateIso+'T'+hhmm+':00'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nl2br(s){ return escapeHtml(s||'').replace(/\n/g,'<br>'); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function validMobile(v){ return /^[6-9]\d{9}$/.test((v||'').trim()); }

const CUSTOMER_CATEGORIES = [
  {id:'engineer', icon:'👷', label:'Engineer'}, {id:'mason', icon:'🧱', label:'Mason'},
  {id:'contractor', icon:'🏗️', label:'Contractor'}, {id:'architect', icon:'📐', label:'Architect'},
  {id:'builder', icon:'🏢', label:'Builder'}, {id:'home_owner', icon:'🏠', label:'Home Owner'},
  {id:'plumber', icon:'🔧', label:'Plumber'}, {id:'electrician', icon:'⚡', label:'Electrician'},
  {id:'interior', icon:'🛋️', label:'Interior Designer'}, {id:'dealer', icon:'🏪', label:'Dealer'},
  {id:'supplier', icon:'📦', label:'Supplier'}, {id:'other', icon:'✨', label:'Other'}
];
const CONTACT_CATEGORIES = [
  {id:'new_enquiry', icon:'🆕', label:'New Enquiry'}, {id:'existing', icon:'👤', label:'Existing Customer'},
  {id:'followup', icon:'🔄', label:'Follow-up'}, {id:'site_visit', icon:'📍', label:'Site Visit'},
  {id:'product_enquiry', icon:'🧪', label:'Product Enquiry'}, {id:'price_enquiry', icon:'💰', label:'Price Enquiry'},
  {id:'sample_request', icon:'📦', label:'Sample Request'}, {id:'complaint', icon:'⚠️', label:'Complaint'},
  {id:'reference', icon:'🤝', label:'Reference'}, {id:'payment_followup', icon:'💳', label:'Payment Follow-up'},
  {id:'other', icon:'✨', label:'Other'}
];
const CONTACT_METHODS = [
  {id:'call', icon:'📞', label:'Phone Call'}, {id:'whatsapp', icon:'💬', label:'WhatsApp'},
  {id:'visit', icon:'🚶', label:'Direct Visit'}, {id:'site_visit', icon:'📍', label:'Site Visit'},
  {id:'sms', icon:'💬', label:'SMS'}, {id:'other', icon:'✨', label:'Other'}
];
const NOTE_CATEGORIES = ['General','Enquiry','Product','Price','Site','Complaint','Follow-up','Important','Other'];
const PRIORITIES = ['Normal','Important','High','Urgent'];
const SNOOZE_OPTS = [['1h','1 Hour'],['tomorrow','Tomorrow'],['3d','3 Days'],['7d','7 Days'],['custom','Custom Date & Time']];
const REMIND_BEFORE = [['0','At time'],['5','5 min before'],['10','10 min before'],['15','15 min before'],['30','30 min before'],['60','1 hour before']];
const REPEAT_OPTS = [['none','Does not repeat'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']];

function defaultDB(){
  return {
    customers: [],
    items: [

function getPath(obj, path){ return path.split('.').reduce((o,k)=>(o==null?undefined:o[k]), obj); }
function setPath(obj, path, val){

}

/* ============================================================
   REMINDER STATUS LOGIC
============================================================ */
function reminderStatus(r){
  if(r.status==='completed') return 'completed';
  if(r.status==='snoozed' && r.snoozeUntil){
    return new Date(r.snoozeUntil) > new Date() ? 'snoozed' : 'overdue';
  }
  const dt = combineDT(r.date, r.time);
  if(!dt) return 'upcoming';
  const now = new Date();
  const sameDay = dt.toDateString() === now.toDateString();
  if(dt < now) return 'overdue';
  if(sameDay) return 'today';
  return 'upcoming';
}

  upcoming:{label:'Upcoming', color:'#3B82F6', dot:'🔵'},
  today:{label:'Today', color:'#F97316', dot:'🟠'},

  snoozed:{label:'Snoozed', color:'#EAB308', dot:'🟡'},
  completed:{label:'Completed', color:'#22C55E', dot:'🟢'},
  rescheduled:{label:'Rescheduled', color:'#22C55E', dot:'📅'}
};
function pushHistory(r, event){ r.history = r.history||[]; r.history.push({ts:new Date().toISOString(), event}); }

    </div>

  </div>

    <div class="wi" style="background:var(--${step.accent}-grad)">${step.icon}</div>

  </div>

  <div class="wiz-nav">
    ${wStep>1 ? `<button class="btn ghost" data-act="wizPrev">← Previous</button>` : `<button class="btn ghost" disabled>← Previous</button>`}
    ${wStep<STEPS.length ? `<button class="btn primary" data-act="wizNext">Next →</button>` : `<button class="btn primary" data-act="wizSave">✅ Save Customer Record</button>`}
  </div>
  `;
}

function wizardStepBody(key){
  switch(key){
    case 'customer': return stepCustomer();
    case 'item': return stepItem();
    case 'contact': return stepContact();
    case 'note': return stepNote();
    case 'followup': return stepFollowup();
    case 'reminder': return stepReminder();
    case 'review': return stepReview();
  }
}

/* ============================================================
   IMAGE COMPRESSION
============================================================ */
function compressImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality||0.75));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function saveCustomerRecord(){
  const d = draft;
  if(!d.customer.name.trim() || !d.customer.category || !validMobile(d.customer.mobile)){
    toast('Please complete the Customer step first'); wStep=1; render(); return;
  }
  const customerId = uid('cust');
  const now = new Date().toISOString();
  DB.customers.push({ id:customerId, name:d.customer.name.trim(), category:d.customer.category,
    mobile:d.customer.mobile.trim(), whatsapp:d.customer.whatsapp.trim(), altMobile:d.customer.altMobile.trim(),
    address:d.customer.address.trim(), location:d.customer.location.trim(), items:d.items.selected.slice(),
    createdAt: now });

  let noteId = null;
  if(d.note.title.trim() || d.note.body.trim()){
    noteId = uid('note');
    DB.notes.push({ id:noteId, customerId, title:d.note.title.trim(), body:d.note.body.trim(),
      category:d.note.category, images:d.note.images.slice(), createdAt: now });
  }
  if(d.contact.category || d.contact.method || d.contact.details.trim()){
    DB.contacts.push({ id:uid('cont'), customerId, category:d.contact.category, method:d.contact.method,
      date:d.contact.date, time:d.contact.time, details:d.contact.details.trim(), createdAt: now });
  }
  let followupId=null;
  if(d.followup.required){
    followupId = uid('fu');
    DB.followups.push({ id:followupId, customerId, required:true, date:d.followup.date, time:d.followup.time,
      reason:d.followup.reason.trim(), method:d.followup.method, priority:d.followup.priority, createdAt: now });
  }
  if(d.reminder.create){
    DB.reminders.push({ id:uid('rem'), customerId, relatedNoteId:noteId, relatedFollowupId:followupId,
      date:d.reminder.date, time:d.reminder.time, reason:d.reminder.reason.trim(), method:d.reminder.method,
      priority:d.reminder.priority, repeat:d.reminder.repeat, remindBefore:d.reminder.remindBefore,
      status:'pending', history:[{ts:now, event:'Created'}], createdAt: now });
  }

  saveDB(); clearDraft();
  toast('Customer record saved');
  nav('customer', {id:customerId});
}

function requestNotifPermission(){
  if(!window.Notification){ toast('Notifications are not supported in this browser'); return; }
  Notification.requestPermission().then(p=>{
    toast(p==='granted' ? 'Reminder notifications enabled' : 'Permission not granted');
    render();
  });
}

function checkDueReminders(){
  const s = DB.settings;
  if(!s.enableReminders) return;
  const now = new Date();
  let changed=false;
  DB.reminders.forEach(r=>{
    if(r.status!=='pending') return;
    const dt = combineDT(r.date, r.time);
    if(!dt) return;
    const remindMin = parseInt(r.remindBefore||'0',10);
    const fireAt = new Date(dt.getTime() - remindMin*60000);
    if(now >= fireAt && !r._notified){
      r._notified = true; changed = true;
      if(s.showNotification && window.Notification && Notification.permission==='granted'){
        const c = DB.customers.find(x=>x.id===r.customerId);
        try{
          new Notification('🔔 Customer Reminder', {
            body: `${c?c.name:'Customer'} — ${r.reason||'Reminder'}\n⏰ ${fmtTime(r.time)}`
          });
        }catch(e){}
      }
      if(s.vibration && navigator.vibrate) navigator.vibrate([200,100,200]);
    }
  });
  if(changed) saveDB();
}
setInterval(checkDueReminders, 30000);

/* ============================================================
   EVENT DELEGATION
============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id, val = el.dataset.val, idx = el.dataset.idx, route_ = el.dataset.route;

  switch(act){
    case 'nav': nav(route_, id?{id}:null); break;
    case 'startWizard': startWizard(false); break;
    case 'closeWizard':
      if(confirm('Close without saving? Your progress is kept as a draft you can resume.')){ nav('dashboard'); }
      break;
    case 'wizNext': wizardNext(); break;
    case 'wizPrev': wStep=Math.max(1,wStep-1); render(); break;
    case 'wizSave': saveCustomerRecord(); break;

    case 'selectCustomerCategory': draft.customer.category=val; saveDraft(); render(); break;
    case 'toggleItem': {
      const s = draft.items.selected;
      const i = s.indexOf(val);
      if(i>-1) s.splice(i,1); else s.push(val);
      saveDraft(); render(); break;
    }
    case 'toggleAddItem': addingNewItem = !addingNewItem; render(); break;
    case 'saveNewItem': saveNewItemFromForm(); break;
    case 'selectContactCategory': draft.contact.category=val; saveDraft(); render(); break;
    case 'selectContactMethod': draft.contact.method=val; saveDraft(); render(); break;
    case 'selectNoteCategory': draft.note.category=val; saveDraft(); render(); break;
    case 'removeNoteImage': draft.note.images.splice(+idx,1); saveDraft(); render(); break;
    case 'selectFollowupMethod': draft.followup.method=val; saveDraft(); render(); break;
    case 'selectFollowupPriority': draft.followup.priority=val; saveDraft(); render(); break;
    case 'selectReminderMethod': draft.reminder.method=val; saveDraft(); render(); break;
    case 'selectReminderPriority': draft.reminder.priority=val; saveDraft(); render(); break;
    case 'requestNotifPermission': requestNotifPermission(); break;

    case 'searchCustomersFocus': break;
    case 'dismissBanner': bannerDismissed = true; render(); break;

    case 'callCustomer': doCall(id); break;
    case 'waCustomer': doWhatsapp(id); break;
    case 'completeReminder': completeReminder(id); break;
    case 'openSnooze': modal={type:'snooze', data:{id}}; renderModal(); break;
    case 'openReschedule': modal={type:'reschedule', data:{id}}; renderModal(); break;
    case 'doSnooze': doSnooze(val); break;
    case 'doReschedule': doReschedule(); break;

    case 'openAddNote': modal={type:'addNote', data:{customerId:id, title:'', body:'', category:'', images:[]}}; renderModal(); break;
    case 'openAddContact': modal={type:'addContact', data:{customerId:id, category:'', method:'', date:todayISO(), time:nowHHMM(), details:''}}; renderModal(); break;
    case 'openAddReminder': modal={type:'addReminder', data:{customerId:id, date:todayISO(), time:nowHHMM(), reason:'', priority:'Normal'}}; renderModal(); break;
    case 'closeModal': modal=null; renderModal(); break;
    case 'closeModalBg': modal=null; renderModal(); break;
    case 'mSelectNoteCat': modal.data.category=val; renderModal(); break;
    case 'mRemoveNoteImage': modal.data.images.splice(+idx,1); renderModal(); break;
    case 'mSelectContactCat': modal.data.category=val; renderModal(); break;
    case 'mSelectContactMethod': modal.data.method=val; renderModal(); break;
    case 'mSelectRemPriority': modal.data.priority=val; renderModal(); break;
    case 'saveModalNote': saveModalNote(); break;
    case 'saveModalContact': saveModalContact(); break;
    case 'saveModalReminder': saveModalReminder(); break;
  }
});

document.addEventListener('input', e=>{
  const bindPath = e.target.dataset.bind;
  if(bindPath && draft){ setPath(draft, bindPath, e.target.value); saveDraft(); return; }
  const toggle = e.target.dataset.bindToggle;
  if(toggle && draft){ setPath(draft, toggle, e.target.checked); saveDraft(); render(); return; }
  const setKey = e.target.dataset.bindSettings;
  if(setKey){ DB.settings[setKey]=e.target.value; saveDB(); return; }
  const setToggle = e.target.dataset.bindSettingsToggle;
  if(setToggle){ DB.settings[setToggle]=e.target.checked; saveDB(); return; }
  if(e.target.id==='customerSearchInput'){ customerSearch = e.target.value; }
});
document.addEventListener('change', e=>{
  if(e.target.matches('[data-act="searchCustomers"]')){ customerSearch = e.target.value; render(); focusSearch(); }
  if(e.target.id==='noteImageInput'){ handleNoteImages(e.target.files, draft.note.images); }
  if(e.target.id==='mNoteImageInput'){ handleNoteImages(e.target.files, modal.data.images); }
  if(e.target.id==='newItemImage'){ /* read on save */ }
});
document.addEventListener('keyup', e=>{
  if(e.target.matches('[data-act="searchCustomers"]')){ customerSearch = e.target.value; render(); focusSearch(); }
});
function focusSearch(){ const el = $('#app input[data-act="searchCustomers"]'); if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } }

document.addEventListener('click', e=>{
  if(e.target.closest('label.add-thumb') && e.target.tagName!=='INPUT'){
    const input = e.target.closest('label.add-thumb').querySelector('input');
    if(input) input.click();
  }
});

function handleNoteImages(fileList, targetArr){
  Array.from(fileList).forEach(f=>{
    compressImage(f, 900, 0.75).then(dataUrl=>{
      targetArr.push(dataUrl);
      if(targetArr===draft?.note?.images) saveDraft();
      render();
    });
  });
}

function saveNewItemFromForm(){
  const name = $('#newItemName').value.trim();
  if(!name){ toast('Enter an item name'); return; }
  const icon = $('#newItemIcon').value.trim() || '🧪';
  const desc = $('#newItemDesc').value.trim();
  const fileInput = $('#newItemImage');
  const finish = (imageDataUrl)=>{
    const newId = uid('item');
    DB.items.push({id:newId, name, icon, image:imageDataUrl||null, description:desc, active:true});
    saveDB();
    draft.items.selected.push(newId);
    saveDraft();
    addingNewItem = false;
    toast('Item added');
    render();
  };
  if(fileInput.files && fileInput.files[0]){
    compressImage(fileInput.files[0], 500, 0.8).then(finish);
  } else finish(null);
}

function wizardNext(){
  if(wStep===1){
    const c = draft.customer;
    if(!c.name.trim()){ toast('Customer name is required'); return; }
    if(!c.category){ toast('Please select a customer category'); return; }
    if(!validMobile(c.mobile)){ toast('Enter a valid 10-digit Indian mobile number'); return; }
  }
  if(wStep===5 && draft.followup.required){
    const f = draft.followup;
    if(!f.date || !f.time || !f.reason.trim()){ toast('Fill in follow-up date, time, and reason'); return; }
  }
  if(wStep===6 && draft.reminder.create){
    const r = draft.reminder;
    if(!r.date || !r.time || !r.reason.trim()){ toast('Fill in reminder date, time, and reason'); return; }
  }
  wStep = Math.min(STEPS.length, wStep+1);
  render();
}

function doCall(customerId){
  const c = DB.customers.find(x=>x.id===customerId);
  if(!c || !c.mobile){ toast('No mobile number on file'); return; }
  window.location.href = 'tel:'+c.mobile;
}
function doWhatsapp(customerId){
  const c = DB.customers.find(x=>x.id===customerId);
  const num = (c&&(c.whatsapp||c.mobile))||'';
  if(!num){ toast('No WhatsApp number on file'); return; }
  window.open('https://wa.me/91'+num.replace(/\D/g,''), '_blank');
}
function completeReminder(id){
  const r = DB.reminders.find(x=>x.id===id);
  if(!r) return;
  r.status='completed'; pushHistory(r,'Completed');
  saveDB(); toast('Reminder marked complete'); render();
}
function doSnooze(opt){
  const r = DB.reminders.find(x=>x.id===modal.data.id);
  if(!r) return;
  if(opt==='custom'){
    $('#customSnoozeBox').innerHTML = `
      <div class="field" style="margin-top:14px;"><label>Custom Date</label><input type="date" id="snoozeDate" value="${todayISO()}"></div>
      <div class="field"><label>Custom Time</label><input type="time" id="snoozeTime" value="${nowHHMM()}"></div>
      <button class="btn primary" data-act="doSnoozeCustom">Confirm Snooze</button>`;
    return;
  }
  let until = new Date();
  if(opt==='1h') until = new Date(Date.now()+3600000);
  if(opt==='tomorrow'){ until.setDate(until.getDate()+1); }
  if(opt==='3d'){ until.setDate(until.getDate()+3); }
  if(opt==='7d'){ until.setDate(until.getDate()+7); }
  applySnooze(r, until);
}
document.addEventListener('click', e=>{
  if(e.target.closest('[data-act="doSnoozeCustom"]')){
    const r = DB.reminders.find(x=>x.id===modal.data.id);
    const date = $('#snoozeDate').value, time = $('#snoozeTime').value;
    if(!date || !time){ toast('Pick a date and time'); return; }
    applySnooze(r, combineDT(date,time));
  }
});
function applySnooze(r, untilDate){
  r.status='snoozed'; r.snoozeUntil = untilDate.toISOString(); r._notified=false;
  pushHistory(r, 'Snoozed to '+untilDate.toLocaleString());
  saveDB(); modal=null; toast('Reminder snoozed'); render();
}
function doReschedule(){
  const r = DB.reminders.find(x=>x.id===modal.data.id);
  const date = $('#rsDate').value, time = $('#rsTime').value;
  if(!date||!time){ toast('Pick a new date and time'); return; }
  pushHistory(r, `Rescheduled from ${r.date} ${r.time}`);
  r.date=date; r.time=time; r.status='pending'; r._notified=false;
  saveDB(); modal=null; toast('Reminder rescheduled'); render();
}

function saveModalNote(){
  const d = modal.data;
  d.title = $('#mNoteTitle').value.trim();
  d.body = $('#mNoteBody').value.trim();
  if(!d.body && !d.title){ toast('Write something first'); return; }
  DB.notes.push({id:uid('note'), customerId:d.customerId, title:d.title, body:d.body, category:d.category, images:d.images.slice(), createdAt:new Date().toISOString()});
  saveDB(); modal=null; toast('Note added'); render();
}
function saveModalContact(){
  const d = modal.data;
  d.date = $('#mContactDate').value; d.time = $('#mContactTime').value; d.details = $('#mContactDetails').value.trim();
  DB.contacts.push({id:uid('cont'), customerId:d.customerId, category:d.category, method:d.method, date:d.date, time:d.time, details:d.details, createdAt:new Date().toISOString()});
  saveDB(); modal=null; toast('Contact added'); render();
}
function saveModalReminder(){
  const d = modal.data;
  d.date = $('#mRemDate').value; d.time = $('#mRemTime').value; d.reason = $('#mRemReason').value.trim();
  if(!d.date || !d.time){ toast('Pick a date and time'); return; }
  DB.reminders.push({id:uid('rem'), customerId:d.customerId, date:d.date, time:d.time, reason:d.reason, method:'', priority:d.priority, repeat:'none', remindBefore:'0', status:'pending', history:[{ts:new Date().toISOString(),event:'Created'}], createdAt:new Date().toISOString()});
  saveDB(); modal=null; toast('Reminder added'); render();
}

/* ============================================================
   BOOT
============================================================ */
function render(){
  updateTabActive();
  $('#app').innerHTML = ({
    dashboard: viewDashboard,
    customers: viewCustomerList,
    customer: ()=>viewCustomerProfile(route.params.id),
    wizard: viewWizard,
    reminders: viewReminders,
    settings: viewSettings
  }[route.name] || viewDashboard)();
  updateTabActive();
}

(function boot(){
  checkDueReminders();
  const hasDraft = !!localStorage.getItem(DRAFT_KEY);
  if(hasDraft){
    setTimeout(()=>{ if(confirm('You have an unfinished customer draft. Resume it?')) startWizard(true); }, 200);
  }
  render();
})();

})();
</script>
</body>
</html>
